[functions.pandora-owner-api]
verify_jwt = true

# This private workload endpoint validates Vercel OIDC itself before it can use
# the server-only service role. Supabase's user-JWT gateway must not consume the
# workload bearer first.
[functions.mcpmaster-supabase-control]
verify_jwt = false

[functions.flutterflow-credential-handoff]
verify_jwt = true

# The broker verifies GitHub OIDC itself. Supabase's user-JWT gateway must not
# consume that workload bearer before the function can verify it.
[functions.flutterflow-github-oidc-broker]
verify_jwt = false
