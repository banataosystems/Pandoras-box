name: Pandora mobile formatter evidence (read-only)

on:
  push:
    branches:
      - 'integration/pandora-mobile-p1-current-main-20260819'
    paths:
      - '.github/workflows/pandora-mobile-format-evidence-readonly.yml'
      - 'apps/pandora-mobile/lib/features/approvals/approvals_screen.dart'

permissions:
  contents: read
  statuses: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Register formatter evidence run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state='pending' \
            -f context='Pandora Mobile formatter evidence' \
            -f description='Flutter 3.47 formatter evidence is being captured.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Capture canonical formatted bytes
        shell: bash
        run: |
          set -euo pipefail
          source=apps/pandora-mobile/lib/features/approvals/approvals_screen.dart
          evidence=.pandora-mobile-format-evidence
          mkdir -p "$evidence"
          cp "$source" "$evidence/before.dart"
          dart format "$source"
          cp "$source" "$evidence/approvals_screen.formatted.dart"
          diff -u "$evidence/before.dart" "$source" > "$evidence/formatter.patch" || true
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "flutter_version=3.47.0"
            echo "before_sha256=$(sha256sum "$evidence/before.dart" | cut -d ' ' -f1)"
            echo "formatted_sha256=$(sha256sum "$source" | cut -d ' ' -f1)"
          } > "$evidence/manifest.txt"
      - name: Upload formatter evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-formatter-evidence
          path: .pandora-mobile-format-evidence
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish formatter evidence verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state='success'
          description='Flutter 3.47 canonical formatted bytes captured.'
          if [[ "$JOB_STATUS" != 'success' ]]; then
            state='failure'
            description='Formatter evidence capture failed.'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context='Pandora Mobile formatter evidence' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
