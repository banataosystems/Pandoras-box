name: Pandora SDK Runtime Contract Probe

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-sdk-runtime-contract-probe.yml

permissions:
  contents: write

jobs:
  expand-runtime-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Expand inspection-only signed SDK predicate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('automation/flutterflow/dsl/10_owner_api_state_navigation.dart')
          text = path.read_text()
          start = text.index('      final probeLine = lines[i];')
          end = text.index('      hits += 1;', start)
          replacement = '''      final probeLine = lines[i];
      final runtimeContractHit =
          probeLine.contains('class FlutterFlowAIClient') ||
          probeLine.contains('runFlutterFlowAIDsl') ||
          probeLine.contains('compileAppDeclarations') ||
          probeLine.contains('validateProject') ||
          probeLine.contains('fetchProject') ||
          probeLine.contains('getProject') ||
          probeLine.contains('pushProject') ||
          probeLine.contains('FlutterFlowAIClient(');
      if (!runtimeContractHit) {
        continue;
      }
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
      - name: Commit runtime contract predicate
        run: |
          git config user.name 'Pandora SDK Probe'
          git config user.email 'pandora-sdk-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Probe signed SDK runtime contract'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
