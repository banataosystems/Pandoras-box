name: Temporary FlutterFlow API Definition Diagnostic

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FlutterFlow API endpoint variable definitions
        run: |
          set -euo pipefail
          curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-api-definition-diagnostic' \
            --data-urlencode 'code=ff-api-def-diag-20260812'
