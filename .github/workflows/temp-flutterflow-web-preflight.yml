name: Temporary FlutterFlow Remaining API Action Validation

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Retry remaining FlutterFlow API action leaf validation
        run: |
          set -euo pipefail
          curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-api-action-leaf-validator-remaining' \
            --data-urlencode 'code=ff-api-leaf-remaining-20260812'
