name: Temporary FlutterFlow Error Diagnostic

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current FlutterFlow validation and broken references
        run: |
          set -euo pipefail
          curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-error-diagnostic' \
            --data-urlencode 'code=ffdiag-20260812-0330-8f4d1'
