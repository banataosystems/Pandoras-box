name: Temporary FlutterFlow Live Site Check

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  livecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check published FlutterFlow site
        run: |
          set -euo pipefail
          curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-live-site-check' \
            --data-urlencode 'code=pandora-live-check-20260812'
