name: Temporary FlutterFlow Live Site Check

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  livecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check published FlutterFlow site
        run: |
          set -euo pipefail
          url='https://pandoras-box-gj9hnb.flutterflow.app/'
          status="$(curl --silent --show-error --location --output /tmp/site.html --write-out '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$status"
          if [ -f /tmp/site.html ]; then
            echo "BODY_BYTES=$(wc -c < /tmp/site.html)"
            title="$(grep -o -m1 -E '<title[^>]*>[^<]*</title>' /tmp/site.html || true)"
            echo "TITLE=$title"
            if grep -Eqi 'flutter_bootstrap|main\.dart\.js|flutter\.js' /tmp/site.html; then echo 'FLUTTER_BOOTSTRAP=true'; else echo 'FLUTTER_BOOTSTRAP=false'; fi
            if grep -Eqi 'pandora' /tmp/site.html; then echo 'PANDORA_MARKER=true'; else echo 'PANDORA_MARKER=false'; fi
            head -c 300 /tmp/site.html | tr '\n' ' '; echo
          fi
