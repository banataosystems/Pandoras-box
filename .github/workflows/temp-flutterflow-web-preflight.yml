name: Temporary FlutterFlow API Action Leaf Validation

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FlutterFlow API action leaf files
        run: |
          set -euo pipefail
          curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-api-action-leaf-validator' \
            --data-urlencode 'code=ff-api-leaf-validate-20260812'
