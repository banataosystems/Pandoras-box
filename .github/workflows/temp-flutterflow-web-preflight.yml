    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FlutterFlow web publishing settings
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-web-deploy-preflight' \
            --data-urlencode 'code=ec8d58b0f6966a7c14a2563a8c19740194f7ed48de4e73d8b96d4a883cc68826'
