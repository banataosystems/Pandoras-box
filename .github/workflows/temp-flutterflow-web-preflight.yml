name: Temporary FlutterFlow Error Diagnostic

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-web-preflight-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current FlutterFlow validation and broken references
        run: |
          set -euo pipefail
          endpoint='https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-error-diagnostic'
          code='ffdiag-20260812-0330-8f4d1'
          files=(
            'app-details'
            'nav-bar'
            'web-publishing'
            'page/id-Scaffold_scaffold1_0'
            'page/id-Scaffold_scaffold2_53'
            'page/id-Scaffold_scaffold3_130'
            'page/id-Scaffold_scaffold5_230'
            'page/id-Scaffold_scaffold6_342'
            'page/id-Scaffold_scaffold7_450'
            'page/id-Scaffold_scaffold8_547'
            'page/id-Scaffold_scaffold9_664'
            'page/id-Scaffold_scaffold10_778'
            'page/id-Scaffold_scaffold11_918'
          )
          for file in "${files[@]}"; do
            echo "===== ${file} ====="
            curl --silent --show-error --get "$endpoint" \
              --data-urlencode "code=$code" \
              --data-urlencode "file=$file"
            echo
            sleep 4
          done
