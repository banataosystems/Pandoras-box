name: Pandora Owner API Diff Imports v2

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-owner-api-diff-imports-v2.yml

permissions:
  contents: write

jobs:
  patch-probe-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Add verified signed-SDK imports
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("automation/flutterflow/dsl/10_owner_api_state_navigation.dart"); t=p.read_text(); m="import '\''package:flutterflow_ai/flutterflow_ai.dart'\'';\n"; i=m+"import '\''package:flutterflow_ai/src/client/flutterflow_ai_client.dart'\'' show FlutterFlowAI;\nimport '\''package:flutterflow_ai/src/helpers/api_helpers.dart'\'' show findApiEndpoint, findApiGroup;\n"; assert t.count(m)==1; assert "flutterflow_ai_client.dart" not in t; p.write_text(t.replace(m,i,1))'
          git diff --check
      - name: Commit temporary probe imports
        shell: bash
        run: |
          git config user.name 'Pandora API Diff Probe'
          git config user.email 'pandora-api-diff-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Expose verified SDK modules to owner API diff probe'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
