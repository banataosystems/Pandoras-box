name: Pandora P2 Design Guard

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-p2-design-guard.yml

permissions:
  contents: write

jobs:
  premium-design-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Compile guards
        run: |
          python3 -m py_compile automation/pandora_p1_source_guard.py automation/pandora_p2_design_guard.py
      - name: Apply premium design system
        run: python3 automation/pandora_p2_design_guard.py --apply
      - name: Verify P1 and P2 source contracts
        run: |
          git diff --check
          python3 automation/pandora_p1_source_guard.py --check
          python3 automation/pandora_p2_design_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified premium design system
        run: |
          git config user.name 'Pandora Design Guard'
          git config user.email 'pandora-design-guard@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart automation/flutterflow/dsl/selector_bindings.dart
          if git diff --cached --quiet; then
            echo 'No design-system changes were necessary.'
            exit 0
          fi
          git commit -m 'Implement Pandora premium shared design system'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
