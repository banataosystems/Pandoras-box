name: ProjectOS security regression

on:
  pull_request:
    paths:
      - '.github/workflows/projectos-security.yml'
      - 'api/**'
      - 'apps/**'
      - 'packages/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'supabase/**'
      - 'test/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectos-security.yml'
      - 'api/**'
      - 'apps/**'
      - 'packages/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'supabase/**'
      - 'test/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: projectos-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
