name: ProjectOS security regression

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'supabase/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docs/supabase/recovery/jcyqixttuebxqqfkjonq/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'supabase/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docs/supabase/recovery/jcyqixttuebxqqfkjonq/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: projectos-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
