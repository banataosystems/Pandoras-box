name: Pandora Owner API Rerun Adapter

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-owner-api-rerun-adapter.yml

permissions:
  contents: write

jobs:
  install-rerun-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install permanent rerun-safe owner API adapter
        run: |
          python3 -m py_compile automation/flutterflow/install_owner_api_rerun_adapter.py
          python3 automation/flutterflow/install_owner_api_rerun_adapter.py
          git diff --check
      - name: Verify existing source guards and owner tests
        run: |
          python3 automation/pandora_p1_source_guard.py --check
          python3 automation/pandora_p2_design_guard.py --check
          python3 automation/pandora_p3_screen_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified rerun adapter
        run: |
          git config user.name 'Pandora Rerun Guard'
          git config user.email 'pandora-rerun-guard@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Make Pandora owner API reruns fail-closed and idempotent'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
