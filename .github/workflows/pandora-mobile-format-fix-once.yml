name: Pandora mobile format fix once

on:
  push:
    branches:
      - integration/pandora-mobile-p1-current-main-20260819
    paths:
      - '.github/pandora-mobile-format-fix.trigger'

permissions:
  contents: write

concurrency:
  group: pandora-mobile-format-fix-once
  cancel-in-progress: false

jobs:
  format:
    name: format exact visual harness
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'integration/pandora-mobile-p1-current-main-20260819'
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format only the production-screen visual harness
        shell: bash
        run: |
          set -euo pipefail
          target=apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart
          dart format "$target"
          dart format --output=none --set-exit-if-changed "$target"
          git diff --check
          changed=$(git diff --name-only | sort)
          test "$changed" = "$target"
          rm .github/pandora-mobile-format-fix.trigger
          rm .github/workflows/pandora-mobile-format-fix-once.yml
      - name: Commit without force only if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'Pandora Mobile Worker 5'
          git config user.email 'lawbatalla@gmail.com'
          git add apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart \
            .github/pandora-mobile-format-fix.trigger \
            .github/workflows/pandora-mobile-format-fix-once.yml
          git commit -m 'style(mobile): format exact visual harness'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
