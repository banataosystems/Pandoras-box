name: Bootstrap governed Memory evidence intake

on:
  push:
    branches:
      - feature/projectos-memory-evidence-intake
    paths:
      - '.github/workflows/memory-evidence-intake-bootstrap.yml'
      - 'scripts/bootstrap-memory-evidence-intake.js'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: repair memory evidence bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install exact dependencies
        run: npm ci

      - name: Apply bounded source patch
        run: node scripts/bootstrap-memory-evidence-intake.js

      - name: Verify exact bounded change
        run: |
          set -euo pipefail
          node -c src/tools/memory-evidence-intake.js
          node -c src/tools/memory.js
          node -c src/runtime/tool-manifest.js
          node --test test/memory-evidence-intake.test.js
          npm run check
          npm test

      - name: Commit source change and retire bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memory-evidence-intake-bootstrap.yml
          git rm scripts/bootstrap-memory-evidence-intake.js
          git add src/tools/memory.js src/tools/memory-evidence-intake.js src/runtime/tool-manifest.js test/memory-evidence-intake.test.js
          git diff --cached --check
          git commit -m "feat: add governed Memory evidence candidate intake"
          git push origin HEAD:feature/projectos-memory-evidence-intake
