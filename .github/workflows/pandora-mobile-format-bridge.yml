name: Pandora mobile format bridge

on:
  push:
    branches:
      - feature/pandora-mobile-owner-experience-p1

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Apply exact formatter output
        working-directory: apps/pandora-mobile
        run: |
          set -euo pipefail
          dart format \
            lib/core/data/owner_projection.dart \
            lib/core/widgets/owner_experience.dart \
            lib/features/activity/activity_screen.dart \
            lib/features/approvals/approvals_screen.dart \
            lib/features/connections/connections_screen.dart \
            lib/features/home/home_screen.dart \
            lib/features/projects/projects_screen.dart \
            test/core/data/safety_overview_deduplication_test.dart

      - name: Commit formatter output atomically
        run: |
          set -euo pipefail
          git config user.name "Mark Johnson Banatao"
          git config user.email "lawbatalla@gmail.com"
          git add -- \
            apps/pandora-mobile/lib/core/data/owner_projection.dart \
            apps/pandora-mobile/lib/core/widgets/owner_experience.dart \
            apps/pandora-mobile/lib/features/activity/activity_screen.dart \
            apps/pandora-mobile/lib/features/approvals/approvals_screen.dart \
            apps/pandora-mobile/lib/features/connections/connections_screen.dart \
            apps/pandora-mobile/lib/features/home/home_screen.dart \
            apps/pandora-mobile/lib/features/projects/projects_screen.dart \
            apps/pandora-mobile/test/core/data/safety_overview_deduplication_test.dart
          if git diff --cached --quiet; then
            echo "No formatter changes were needed."
            exit 0
          fi
          git commit -m "style(mobile): apply pinned Dart formatter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
