name: FlutterFlow unattended project inspection

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/flutterflow-unattended.yml
      - automation/flutterflow/dsl/**
      - automation/flutterflow/run.json
      - assets/brand/pandoras-box/product-mark/**

permissions: {}

concurrency:
  group: flutterflow-unattended-project-operation
  cancel-in-progress: false

jobs:
  operate-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: "3.12.2"

      - name: Install pinned FlutterFlow CLI
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate flutterflow_cli 0.0.39
          dart pub global list | grep -Fx 'flutterflow_cli 0.0.39'
          printf '%s\n' "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"

      - name: Read authorized operation mode
        id: operation-mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(
            python3 -c 'import json; print(json.load(open("automation/flutterflow/run.json"))["mode"], end="")'
          )"
          case "${mode}" in
            inspect|validate-auth|apply-auth|validate-owner|apply-owner|validate-mfa-action|apply-mfa-action|validate-mfa-ui|apply-mfa-ui|export-build) ;;
            *)
              printf 'Unsupported unattended FlutterFlow mode: %s\n' "${mode}" >&2
              exit 64
              ;;
          esac
          printf 'mode=%s\n' "${mode}" >> "${GITHUB_OUTPUT}"

      - name: Operate exact FlutterFlow project through one-time OIDC grant
        id: operate
        shell: bash
        env:
          BROKER_URL: https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-github-oidc-broker
          OIDC_AUDIENCE: pandora-flutterflow-project-api
          FLUTTERFLOW_PROJECT_ID: pandoras-box-gj9hnb
          EXPECTED_FFAI_VERSION: 0.0.40
          EXPECTED_FFAI_BUILD: b5c8a09d
          OPERATION_MODE: ${{ steps.operation-mode.outputs.mode }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          ulimit -c 0 || true
          cleanup() {
            if [[ -n "${workspace:-}" && "${workspace}" == "${RUNNER_TEMP}/"* ]]; then
              rm -f "${workspace}/.flutterflow/.env"
            fi
            if [[ -n "${export_root:-}" && "${export_root}" == "${RUNNER_TEMP}/"* ]]; then
              rm -f "${export_root}/.flutterflow/.env"
            fi
            if [[ -n "${rollback_snapshot:-}" && "${rollback_snapshot}" == "${RUNNER_TEMP}/"* ]]; then
              rm -f "${rollback_snapshot}"
            fi
            if [[ -n "${after_snapshot:-}" && "${after_snapshot}" == "${RUNNER_TEMP}/"* ]]; then
              rm -f "${after_snapshot}"
            fi
            if [[ -n "${broker_response:-}" && "${broker_response}" == "${RUNNER_TEMP}/"* ]]; then
              rm -f "${broker_response}"
            fi
            unset oidc_json oidc_token broker_json broker_status broker_error_code ff_token broker_project_id
          }
          trap cleanup EXIT

          oidc_json="$(
            curl --proto '=https' --tlsv1.2 \
              --fail --silent --show-error --max-time 15 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"], end="")' \
              <<<"${oidc_json}"
          )"
          printf '::add-mask::%s\n' "${oidc_token}"

          broker_response="${RUNNER_TEMP}/pandora-flutterflow-broker-response.json"
          if ! broker_status="$(
            curl --proto '=https' --tlsv1.2 \
              --silent --max-time 20 \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              --data "{\"project_id\":\"${FLUTTERFLOW_PROJECT_ID}\"}" \
              --output "${broker_response}" \
              --write-out '%{http_code}' \
              "${BROKER_URL}"
          )"; then
            unset oidc_json oidc_token
            rm -f "${broker_response}"
            broker_response=""
            printf 'FlutterFlow broker request failed: BROKER_REQUEST_FAILED (HTTP 000)\n' >&2
            exit 22
          fi
          unset oidc_json oidc_token
          if [[ "${broker_status}" != "200" ]]; then
            broker_error_code="$(
              python3 - "${broker_response}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          try:
              code = json.loads(pathlib.Path(sys.argv[1]).read_text()).get("code")
          except Exception:
              code = None
          if not isinstance(code, str) or not re.fullmatch(r"[A-Z0-9_]{1,64}", code):
              code = "UNREADABLE_BROKER_ERROR"
          print(code, end="")
          PY
            )"
            printf 'FlutterFlow broker denied request: %s (HTTP %s)\n' \
              "${broker_error_code}" "${broker_status}" >&2
            exit 22
          fi
          broker_json="$(<"${broker_response}")"
          rm -f "${broker_response}"
          broker_response=""

          ff_token="$(
            python3 -c 'import json,sys; data=json.load(sys.stdin); token=data["token"]; assert isinstance(token,str) and len(token)>=20; print(token,end="")' \
              <<<"${broker_json}"
          )"
          broker_project_id="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["project_id"],end="")' \
              <<<"${broker_json}"
          )"
          printf '::add-mask::%s\n' "${ff_token}"
          unset broker_json
          test "${broker_project_id}" = "${FLUTTERFLOW_PROJECT_ID}"

          mode="${OPERATION_MODE}"
          case "${mode}" in
            inspect|validate-auth|apply-auth|validate-owner|apply-owner|validate-mfa-action|apply-mfa-action|validate-mfa-ui|apply-mfa-ui|export-build) ;;
            *)
              printf 'Unsupported unattended FlutterFlow mode: %s\n' "${mode}" >&2
              exit 64
              ;;
          esac

          workspace="${RUNNER_TEMP}/pandora-flutterflow-ai"
          output="${RUNNER_TEMP}/pandora-flutterflow-result"
          export_root="${RUNNER_TEMP}/pandora-flutter-export"
          mkdir -p "${output}/pages"
          printf '%s\n' "${mode}" > "${output}/operation-mode.txt"

          FF_API_KEY="${ff_token}" flutterflow ai init "${workspace}" \
            --project "${FLUTTERFLOW_PROJECT_ID}" \
            --no-save \
            --yes
          rm -f "${workspace}/.flutterflow/.env"

          (
            cd "${workspace}"
            FF_API_KEY="${ff_token}" flutterflow ai context-check \
              > "${output}/context-check-signed-sdk.txt"
          )
          python3 - \
            "${workspace}" \
            "${output}/signed-sdk-verification.json" \
            "${EXPECTED_FFAI_VERSION}" \
            "${EXPECTED_FFAI_BUILD}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          workspace = pathlib.Path(sys.argv[1])
          evidence_path = pathlib.Path(sys.argv[2])
          expected_version = sys.argv[3]
          expected_build = sys.argv[4]
          config_path = workspace / ".flutterflow" / "config.yaml"
          sdk_root = workspace / ".flutterflow" / "sdk" / "flutterflow_ai"
          manifest_path = sdk_root / "manifest.json"
          signature_path = sdk_root / "manifest.sig"
          pubspec_path = sdk_root / "pubspec.yaml"

          def config_value(key):
              match = re.search(
                  rf"(?m)^\s*{re.escape(key)}\s*:\s*['\"]?([^'\"\s#]+)",
                  config_path.read_text(),
              )
              if match is None:
                  raise SystemExit(f"Signed SDK config is missing {key}")
              return match.group(1)

          manifest = json.loads(manifest_path.read_text())
          signature = signature_path.read_bytes()
          pubspec_match = re.search(
              r"(?m)^version:\s*([^\s#]+)",
              pubspec_path.read_text(),
          )
          if pubspec_match is None:
              raise SystemExit("Vendored FlutterFlow SDK pubspec has no version")

          observed = {
              "config_version": config_value("flutterflow_ai_version"),
              "config_build": config_value("flutterflow_ai_build"),
              "manifest_version": manifest.get("version"),
              "manifest_build": manifest.get("build_id"),
              "manifest_environment": manifest.get("env"),
              "manifest_commit": manifest.get("commit"),
              "manifest_released": manifest.get("released"),
              "manifest_sha256": hashlib.sha256(
                  manifest_path.read_bytes()
              ).hexdigest(),
              "signature_sha256": hashlib.sha256(signature).hexdigest(),
              "pubspec_version": pubspec_match.group(1),
          }
          if len(signature) < 32:
              raise SystemExit("Vendored FlutterFlow SDK signature is missing")
          if {
              observed["config_version"],
              observed["manifest_version"],
              observed["pubspec_version"],
          } != {expected_version}:
              raise SystemExit(f"Unexpected FlutterFlow SDK version: {observed}")
          if {
              observed["config_build"],
              observed["manifest_build"],
          } != {expected_build}:
              raise SystemExit(f"Unexpected FlutterFlow SDK build: {observed}")
          if observed["manifest_environment"] != "prod":
              raise SystemExit(f"Unexpected FlutterFlow SDK environment: {observed}")
          if not re.fullmatch(r"[0-9a-f]{40}", observed["manifest_commit"] or ""):
              raise SystemExit(f"Invalid signed SDK commit: {observed}")
          evidence = {
              "verification": (
                  "flutterflow_cli 0.0.39 ai init verified the Ed25519-signed "
                  "manifest and archive before vendoring; context-check passed"
              ),
              "expected_version": expected_version,
              "expected_build": expected_build,
              "observed": observed,
          }
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY

          mkdir -p "${workspace}/dsl"
          cp automation/flutterflow/dsl/*.dart "${workspace}/dsl/"

          FF_SECRET="${ff_token}" python3 - "${workspace}" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          secret = os.environ["FF_SECRET"].encode()
          for path in root.rglob("*"):
              if path.is_file() and secret in path.read_bytes():
                  raise SystemExit("FlutterFlow credential persisted outside the deleted workspace .env")
          PY

          operate() {
            cd "${workspace}"
            case "${mode}" in
              inspect)
                FF_API_KEY="${ff_token}" flutterflow ai status "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/status.txt"
                FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/project-summary.txt"
                FF_API_KEY="${ff_token}" flutterflow ai resources "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/resources.json"

                pages=(
                  SplashConnection
                  SignIn
                  CommandCenter
                  ActionsCatalog
                  ActionBuilder
                  ApprovalCenter
                  ActivityAuditTrail
                  SecurityOperations
                  ProjectDetails
                  PlansExecution
                )
                for page in "${pages[@]}"; do
                  FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                    --page "${page}" \
                    --dsl-json \
                    --output "${output}/pages/${page}.json"
                  FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                    --page "${page}" \
                    --outline \
                    > "${output}/pages/${page}.outline.txt"
                done
                ;;
              validate-auth)
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/00_auth_route_guards.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-auth.txt"
                ;;
              apply-auth)
                rollback_snapshot="${RUNNER_TEMP}/pandora-pre-auth-project-yamls.json"
                curl --proto '=https' --tlsv1.2 \
                  --fail --silent --show-error --max-time 120 \
                  -H "Authorization: Bearer ${ff_token}" \
                  "https://api.flutterflow.io/v2/projectYamls?projectId=${FLUTTERFLOW_PROJECT_ID}" \
                  > "${rollback_snapshot}"
                python3 - "${rollback_snapshot}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          value = payload.get("value")
          encoded = value.get("project_yaml_bytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str):
              encoded = value.get("projectYamlBytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str) or len(encoded) < 100:
              raise SystemExit("Pre-change FlutterFlow YAML snapshot is missing")
          PY
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/00_auth_route_guards.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-auth.txt"
                FF_API_KEY="${ff_token}" flutterflow ai run \
                  dsl/00_auth_route_guards.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  --commit-message 'Configure Pandora Supabase auth and route guards' \
                  > "${output}/apply-auth.txt"
                FF_API_KEY="${ff_token}" flutterflow ai refresh-context \
                  "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/refresh-auth-context.txt"
                FF_API_KEY="${ff_token}" flutterflow ai context-check \
                  > "${output}/context-check-auth.txt"
                FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/post-auth-summary.txt"
                ;;
              validate-owner)
                FF_PANDORA_INSTALL_GLOBAL_NAV=true FF_API_KEY="${ff_token}" \
                  flutterflow ai validate dsl/10_owner_api_state_navigation.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-owner.txt"
                ;;
              apply-owner)
                rollback_snapshot="${RUNNER_TEMP}/pandora-pre-owner-project-yamls.json"
                curl --proto '=https' --tlsv1.2 \
                  --fail --silent --show-error --max-time 120 \
                  -H "Authorization: Bearer ${ff_token}" \
                  "https://api.flutterflow.io/v2/projectYamls?projectId=${FLUTTERFLOW_PROJECT_ID}" \
                  > "${rollback_snapshot}"
                python3 - "${rollback_snapshot}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          value = payload.get("value")
          encoded = value.get("project_yaml_bytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str):
              encoded = value.get("projectYamlBytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str) or len(encoded) < 100:
              raise SystemExit("Pre-change FlutterFlow YAML snapshot is missing")
          PY
                FF_PANDORA_INSTALL_GLOBAL_NAV=true FF_API_KEY="${ff_token}" \
                  flutterflow ai validate dsl/10_owner_api_state_navigation.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-owner.txt"
                FF_PANDORA_INSTALL_GLOBAL_NAV=true FF_API_KEY="${ff_token}" \
                  flutterflow ai run dsl/10_owner_api_state_navigation.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  --commit-message 'Wire Pandora owner app to governed live services' \
                  > "${output}/apply-owner.txt"
                FF_API_KEY="${ff_token}" flutterflow ai refresh-context \
                  "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/refresh-owner-context.txt"
                FF_API_KEY="${ff_token}" flutterflow ai context-check \
                  > "${output}/context-check-owner.txt"
                FF_API_KEY="${ff_token}" flutterflow ai codegen status \
                  > "${output}/codegen-status-owner.txt"
                FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/post-owner-summary.txt"
                after_snapshot="${RUNNER_TEMP}/pandora-post-owner-project-yamls.json"
                curl --proto '=https' --tlsv1.2 \
                  --fail --silent --show-error --max-time 120 \
                  -H "Authorization: Bearer ${ff_token}" \
                  "https://api.flutterflow.io/v2/projectYamls?projectId=${FLUTTERFLOW_PROJECT_ID}" \
                  > "${after_snapshot}"
                python3 - \
                  "${rollback_snapshot}" \
                  "${after_snapshot}" \
                  "${output}/owner-readback-manifest.json" \
                  "${GITHUB_SHA}" \
                  "${mode}" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import sys

          def project_bytes(path_arg):
              path = pathlib.Path(path_arg)
              raw = path.read_bytes()
              payload = json.loads(raw)
              value = payload.get("value")
              encoded = value.get("project_yaml_bytes") if isinstance(value, dict) else None
              if not isinstance(encoded, str):
                  encoded = value.get("projectYamlBytes") if isinstance(value, dict) else None
              if not isinstance(encoded, str) or len(encoded) < 100:
                  raise SystemExit(f"{path.name} has no project YAML bytes")
              return raw, base64.b64decode(encoded, validate=True)

          before_raw, before_project = project_bytes(sys.argv[1])
          after_raw, after_project = project_bytes(sys.argv[2])
          evidence = {
              "schema_version": "1.0.0",
              "candidate_sha": sys.argv[4],
              "mode": sys.argv[5],
              "project_id": "pandoras-box-gj9hnb",
              "before_response_sha256": hashlib.sha256(before_raw).hexdigest(),
              "before_project_sha256": hashlib.sha256(before_project).hexdigest(),
              "after_response_sha256": hashlib.sha256(after_raw).hexdigest(),
              "after_project_sha256": hashlib.sha256(after_project).hexdigest(),
              "after_project_bytes": len(after_project),
          }
          pathlib.Path(sys.argv[3]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
                ;;
              validate-mfa-action)
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/20_mfa_aal2_custom_action.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-mfa-action.txt"
                ;;
              apply-mfa-action)
                rollback_snapshot="${RUNNER_TEMP}/pandora-pre-mfa-action-project-yamls.json"
                curl --proto '=https' --tlsv1.2 \
                  --fail --silent --show-error --max-time 120 \
                  -H "Authorization: Bearer ${ff_token}" \
                  "https://api.flutterflow.io/v2/projectYamls?projectId=${FLUTTERFLOW_PROJECT_ID}" \
                  > "${rollback_snapshot}"
                python3 - "${rollback_snapshot}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          value = payload.get("value")
          encoded = value.get("project_yaml_bytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str):
              encoded = value.get("projectYamlBytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str) or len(encoded) < 100:
              raise SystemExit("Pre-change FlutterFlow YAML snapshot is missing")
          PY
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/20_mfa_aal2_custom_action.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-mfa-action.txt"
                FF_API_KEY="${ff_token}" flutterflow ai run \
                  dsl/20_mfa_aal2_custom_action.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  --commit-message 'Install fail-closed Pandora AAL2 custom action' \
                  > "${output}/apply-mfa-action.txt"
                FF_API_KEY="${ff_token}" flutterflow ai refresh-context \
                  "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/refresh-mfa-action-context.txt"
                FF_API_KEY="${ff_token}" flutterflow ai context-check \
                  > "${output}/context-check-mfa-action.txt"
                FF_API_KEY="${ff_token}" flutterflow ai codegen status \
                  > "${output}/codegen-status-mfa-action.txt"
                FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/post-mfa-action-summary.txt"
                ;;
              validate-mfa-ui)
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/21_mfa_aal2_ui_gates.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-mfa-ui.txt"
                ;;
              apply-mfa-ui)
                rollback_snapshot="${RUNNER_TEMP}/pandora-pre-mfa-ui-project-yamls.json"
                curl --proto '=https' --tlsv1.2 \
                  --fail --silent --show-error --max-time 120 \
                  -H "Authorization: Bearer ${ff_token}" \
                  "https://api.flutterflow.io/v2/projectYamls?projectId=${FLUTTERFLOW_PROJECT_ID}" \
                  > "${rollback_snapshot}"
                python3 - "${rollback_snapshot}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          value = payload.get("value")
          encoded = value.get("project_yaml_bytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str):
              encoded = value.get("projectYamlBytes") if isinstance(value, dict) else None
          if not isinstance(encoded, str) or len(encoded) < 100:
              raise SystemExit("Pre-change FlutterFlow YAML snapshot is missing")
          PY
                FF_API_KEY="${ff_token}" flutterflow ai validate \
                  dsl/21_mfa_aal2_ui_gates.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/validate-mfa-ui.txt"
                FF_API_KEY="${ff_token}" flutterflow ai run \
                  dsl/21_mfa_aal2_ui_gates.dart \
                  --project-id "${FLUTTERFLOW_PROJECT_ID}" \
                  --commit-message 'Gate Pandora protected work with recoverable AAL2 step-up' \
                  > "${output}/apply-mfa-ui.txt"
                FF_API_KEY="${ff_token}" flutterflow ai refresh-context \
                  "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/refresh-mfa-ui-context.txt"
                FF_API_KEY="${ff_token}" flutterflow ai context-check \
                  > "${output}/context-check-mfa-ui.txt"
                FF_API_KEY="${ff_token}" flutterflow ai codegen status \
                  > "${output}/codegen-status-mfa-ui.txt"
                FF_API_KEY="${ff_token}" flutterflow ai inspect "${FLUTTERFLOW_PROJECT_ID}" \
                  > "${output}/post-mfa-ui-summary.txt"
                ;;
              export-build)
                test ! -e "${export_root}"
                mkdir -p "${export_root}"
                FLUTTERFLOW_API_TOKEN="${ff_token}" flutterflow export-code \
                  --project "${FLUTTERFLOW_PROJECT_ID}" \
                  --dest "${export_root}" \
                  --include-assets \
                  --include-export-manifest \
                  --no-parent-folder \
                  2>&1 | tee "${output}/export-code.txt"
                rm -f "${export_root}/.flutterflow/.env"

                python3 - \
                  "${export_root}" \
                  "${output}/export-metadata-verification.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          evidence_path = pathlib.Path(sys.argv[2])
          required = [
              root / "pubspec.yaml",
              root / ".metadata",
              root / ".flutterflow" / "export_manifest.json",
              root / "web" / "index.html",
              root / "web" / "manifest.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"FlutterFlow export is missing required metadata: {missing}")

          metadata_path = root / ".metadata"
          metadata = metadata_path.read_text()
          revision_match = re.search(
              r"(?m)^\s{2}revision:\s*['\"]?([0-9a-fA-F]{40})['\"]?\s*$",
              metadata,
          )
          channel_match = re.search(
