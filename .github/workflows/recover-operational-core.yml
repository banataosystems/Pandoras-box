name: Inspect MCPMaster operational recovery boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify current operational source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f vercel.json
          test -f api/mcp.ts
          test -f apps/meta-business-mcp/src/operator/api.ts
          test -f public/oauth/consent.html
          node -e "const p=require('./package.json'); if(!p.name) process.exit(1); console.log(p.name, p.version || '')"

      - name: Verify private-key boundary
        shell: bash
        run: >-
          bash scripts/check-private-key-literals.sh
          package.json package-lock.json
          vercel-entrypoint.js vercel.json Dockerfile
          tsconfig.json tsconfig.vercel.json
          .github/workflows api apps assets packages public scripts src supabase

      - name: Record quarantined legacy transport
        shell: bash
        run: |
          set -euo pipefail
          test ! -e recovery/core-transport/core-000.b64
          test ! -e recovery/core-transport/core-rest.b64
          echo 'Legacy operational transport is incomplete and quarantined. This read-only workflow does not restore, commit, push, or publish source.'
