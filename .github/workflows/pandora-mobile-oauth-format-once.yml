name: Pandora mobile OAuth format once
on:
  push:
    branches:
      - fix/pandora-mobile-owner-outcome-p0-20260820
permissions:
  contents: write
jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve exact package context
        working-directory: apps/pandora-mobile
        run: flutter pub get --enforce-lockfile
      - name: Apply exact Dart formatter
        working-directory: apps/pandora-mobile
        run: |
          set -euo pipefail
          dart format lib/core/data/remote_pandora_repository.dart lib/core/models/pandora_models.dart lib/features/connections/connections_screen.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit formatter output and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pandora-mobile-oauth-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/lib/core/data/remote_pandora_repository.dart apps/pandora-mobile/lib/core/models/pandora_models.dart apps/pandora-mobile/lib/features/connections/connections_screen.dart .github/workflows/pandora-mobile-oauth-format-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'style(mobile): normalize OAuth source formatting'
          git push origin HEAD:${GITHUB_REF_NAME}
