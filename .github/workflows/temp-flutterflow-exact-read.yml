name: Temporary FlutterFlow Screen Repair

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/flutterflow-read-trigger.txt

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Repair FlutterFlow sign-in screen with validation
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --get \
            'https://ivmvufhcsezyhczzondn.supabase.co/functions/v1/flutterflow-page-language-repair' \
            --data-urlencode 'code=VJ2GnTHMuyJKYrOCDNBFzp4BZ964mdTGTmrxpvbX2bc' \
            --data-urlencode 'page=2')"
          echo "$response"
          echo "$response" | jq -e '.ok == true' >/dev/null
