name: Pandora mobile analyze diagnostic

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-analyze-diagnostic.yml'

permissions:
  contents: read
  checks: write

jobs:
  analyze-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Reproduce acceptance materialization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format --output=none --set-exit-if-changed lib test

      - name: Capture analyzer output
        shell: bash
        run: |
          set -uo pipefail
          cd .pandora-mobile-build
          flutter analyze --machine > /tmp/pandora-analyze.txt 2>&1
          printf '%s' "$?" > /tmp/pandora-analyze-exit.txt
          exit 0

      - name: Publish analyzer diagnostics as check evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path('/tmp/pandora-analyze.txt').read_text(errors='replace')
          exit_code = Path('/tmp/pandora-analyze-exit.txt').read_text().strip()
          if len(output) > 50000:
              output = output[:50000] + '\n[truncated]'
          payload = {
              'name': 'analyzer-output',
              'head_sha': os.environ['HEAD_SHA'],
              'status': 'completed',
              'conclusion': 'neutral',
              'output': {
                  'title': f'Pinned Flutter analyzer diagnostics (exit {exit_code})',
                  'summary': '```text\n' + output + '\n```',
              },
          }
          Path('/tmp/analyzer-check.json').write_text(json.dumps(payload))
          PY
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/check-runs" \
            --input /tmp/analyzer-check.json
