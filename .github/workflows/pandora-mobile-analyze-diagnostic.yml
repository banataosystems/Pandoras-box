name: Pandora mobile analyzer autofix

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-analyze-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply-analyzer-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Apply exact analyzer fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/pandora-mobile/lib/features/intelligence/owner_intelligence_screen.dart')
          text = path.read_text()
          old = '            value: _section,\n'
          new = '            initialValue: _section,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one analyzer target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cd apps/pandora-mobile
          dart format lib/features/intelligence/owner_intelligence_screen.dart
          cd ../..
          git diff --check

      - name: Commit exact analyzer fix
        shell: bash
        run: |
          set -euo pipefail
          path='apps/pandora-mobile/lib/features/intelligence/owner_intelligence_screen.dart'
          if git diff --quiet -- "$path"; then
            echo 'Analyzer fix already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'fix(mobile): use Flutter initialValue for intelligence selector'
          git push origin HEAD:feature/pandora-mobile-premium-foundation
