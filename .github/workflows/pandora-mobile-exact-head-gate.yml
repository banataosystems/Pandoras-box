name: Pandora mobile exact-head gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/pandora-mobile/**'
      - 'assets/brand/pandoras-box/product-mark/**'
      - 'scripts/verify-pandora-brand-assets.mjs'
      - 'scripts/create-transparent-pandora-mark.py'
      - '.github/workflows/pandora-mobile-integration.yml'
      - '.github/workflows/pandora-mobile-exact-head-gate.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pandora-mobile-exact-head-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Wait for exact-head verification workflows and artifacts
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/exact-head-gate
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          source_sha = os.environ['SOURCE_SHA']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          token = os.environ['GH_TOKEN']
          required_workflows = {
              'Pandora mobile integration':
                  '.github/workflows/pandora-mobile-integration.yml',
              'ProjectOS security regression':
                  '.github/workflows/projectos-security.yml',
          }
          required_artifacts = (
              'pandora-mobile-transparent-mark-evidence',
              'pandora-mobile-owner-screen-evidence',
              'pandora-mobile-web-owner-test',
              'pandora-mobile-android-owner-test',
          )
          api = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'pandora-exact-head-gate',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def workflow_path(run):
              return str(run.get('path') or '').split('@', 1)[0]

          def compact_run(run):
              return {
                  'id': run['id'],
                  'workflow_id': run['workflow_id'],
                  'workflow_path': workflow_path(run),
                  'run_attempt': run['run_attempt'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'html_url': run['html_url'],
                  'head_sha': run['head_sha'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
              }

          deadline = time.time() + 1800
          selected = {}
          while time.time() < deadline:
              query = urllib.parse.urlencode({
                  'head_sha': source_sha,
                  'event': 'pull_request',
                  'per_page': 100,
              })
              runs = get_json(f'{api}/actions/runs?{query}')['workflow_runs']
              selected = {}
              for label, path in required_workflows.items():
                  candidates = [
                      run for run in runs
                      if workflow_path(run) == path
                      and run['id'] != current_run_id
                      and run['head_sha'] == source_sha
                      and run['event'] == 'pull_request'
                  ]
                  if candidates:
                      selected[label] = max(
                          candidates,
                          key=lambda run: (run['id'], run['run_attempt']),
                      )
              if len(selected) == len(required_workflows) and all(
                  run['status'] == 'completed' for run in selected.values()
              ):
                  break
              time.sleep(15)
          else:
              result = {
                  'schema_version': '1.1.0',
                  'source_sha': source_sha,
                  'proof_stage': 'implemented',
                  'gate': 'timeout',
                  'required_workflows': required_workflows,
                  'required_artifacts': required_artifacts,
                  'observed_runs': {
                      label: compact_run(run)
                      for label, run in selected.items()
                  },
                  'artifact_class': 'test-only',
                  'deployed': False,
                  'production_verified': False,
              }
              pathlib.Path('build/exact-head-gate/gate.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True) + '\n'
              )
              raise SystemExit(
                  'Exact-head verification workflows did not complete before timeout.'
              )

          compact = {
              label: compact_run(run)
              for label, run in selected.items()
          }
          source_bound = all(
              run['head_sha'] == source_sha
              and run['event'] == 'pull_request'
              and workflow_path(run) == required_workflows[label]
              for label, run in selected.items()
          )
          all_green = all(
              run['conclusion'] == 'success' for run in selected.values()
          )

          mobile_run = selected['Pandora mobile integration']
          artifacts_payload = get_json(
              f'{api}/actions/runs/{mobile_run["id"]}/artifacts?per_page=100'
          )
          artifacts_by_name = {}
          for artifact in artifacts_payload.get('artifacts', []):
              name = artifact.get('name')
              if name not in required_artifacts:
                  continue
              existing = artifacts_by_name.get(name)
              if existing is None or artifact['id'] > existing['id']:
                  artifacts_by_name[name] = artifact

          artifacts = {
              name: {
                  'id': artifact['id'],
                  'name': artifact['name'],
                  'size_in_bytes': artifact['size_in_bytes'],
                  'expired': artifact['expired'],
                  'created_at': artifact['created_at'],
                  'expires_at': artifact['expires_at'],
                  'workflow_run_id': mobile_run['id'],
                  'source_sha': source_sha,
              }
              for name, artifact in sorted(artifacts_by_name.items())
          }
          missing_artifacts = sorted(
              set(required_artifacts) - set(artifacts_by_name)
          )
          expired_artifacts = sorted(
              name for name, artifact in artifacts_by_name.items()
              if artifact.get('expired') is True
          )
          empty_artifacts = sorted(
              name for name, artifact in artifacts_by_name.items()
              if int(artifact.get('size_in_bytes') or 0) <= 0
          )
          artifacts_ready = not (
              missing_artifacts or expired_artifacts or empty_artifacts
          )
          gate_pass = source_bound and all_green and artifacts_ready

          failures = []
          if not source_bound:
              failures.append('workflow source binding failed')
          if not all_green:
              failures.append(
                  'workflow conclusions: ' + ', '.join(
                      f'{label}={run["conclusion"]}'
                      for label, run in selected.items()
                  )
              )
          if missing_artifacts:
              failures.append(
                  'missing artifacts: ' + ', '.join(missing_artifacts)
              )
          if expired_artifacts:
              failures.append(
                  'expired artifacts: ' + ', '.join(expired_artifacts)
              )
          if empty_artifacts:
              failures.append(
                  'empty artifacts: ' + ', '.join(empty_artifacts)
              )

          result = {
              'schema_version': '1.1.0',
              'source_sha': source_sha,
              'proof_stage': 'tested' if gate_pass else 'implemented',
              'gate': 'pass' if gate_pass else 'blocked',
              'source_bound': source_bound,
              'workflows': compact,
              'required_artifacts': required_artifacts,
              'artifacts': artifacts,
              'artifacts_ready': artifacts_ready,
              'missing_artifacts': missing_artifacts,
              'expired_artifacts': expired_artifacts,
              'empty_artifacts': empty_artifacts,
              'artifact_class': 'test-only',
              'deployed': False,
              'production_verified': False,
              'remaining_gates': [
                  'independent different-vendor review bound to this exact SHA',
                  'reviewed exact-head visual evidence',
                  'physical Android installation and authenticated owner journey',
                  'authorized production promotion and post-promotion verification',
              ],
          }
          pathlib.Path('build/exact-head-gate/gate.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          if not gate_pass:
              raise SystemExit('Exact-head gate blocked: ' + '; '.join(failures))
          PY
      - name: Upload immutable exact-head gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-exact-head-gate
          path: build/exact-head-gate/gate.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish exact-head status to the pull request
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- pandora-mobile-exact-head-gate -->'
          gate=unknown
          proof=implemented
          mobile=not_observed
          security=not_observed
          artifacts=not_observed
          missing=unknown
          if [[ -f build/exact-head-gate/gate.json ]]; then
            gate="$(jq -r '.gate // "unknown"' build/exact-head-gate/gate.json)"
            proof="$(jq -r '.proof_stage // "implemented"' build/exact-head-gate/gate.json)"
            mobile="$(jq -r '.workflows["Pandora mobile integration"].conclusion // "not_observed"' build/exact-head-gate/gate.json)"
            security="$(jq -r '.workflows["ProjectOS security regression"].conclusion // "not_observed"' build/exact-head-gate/gate.json)"
            artifacts="$(jq -r 'if .artifacts_ready == true then "verified" elif .artifacts_ready == false then "blocked" else "not_observed" end' build/exact-head-gate/gate.json)"
            missing="$(jq -r '(.missing_artifacts // []) | if length == 0 then "none" else join(", ") end' build/exact-head-gate/gate.json)"
          fi
          body=$(cat <<EOF
          $marker
          ## Pandora Mobile exact-head gate

          - Exact source: \`$SOURCE_SHA\`
          - Gate: **$gate**
          - Proof stage: **$proof**
          - Pandora mobile integration: **$mobile**
          - ProjectOS security regression: **$security**
          - Required test artifacts: **$artifacts**
          - Missing artifacts: **$missing**
          - Artifact class: **test-only**
          - Deployed: **no claim**
          - Production verified: **no claim**

          A passing gate proves only exact-head CI and the presence of non-empty, unexpired test artifacts from the exact mobile workflow run. Independent different-vendor review, reviewed visual evidence, physical Android verification, authorized promotion, and post-promotion verification remain separate requirements.
          EOF
          )
          existing="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
      - name: Request immutable independent review in issue 54
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- pandora-mobile-independent-review:$SOURCE_SHA -->"
          body=$(cat <<EOF
          $marker
          ## Independent different-vendor review requested

          Review Pandora Mobile RC1 only at exact head \`$SOURCE_SHA\` on PR #$PR_NUMBER.

          Exact-head mobile integration and ProjectOS security regression are green, and the four required non-empty, unexpired test artifacts are bound to the exact mobile workflow run. Independently inspect the complete diff, transparent-mark provenance and verifier, admin control-plane behavior, fail-closed data semantics, authorization boundaries, screenshot evidence, artifact manifests, and rollback path. Record PASS, PASS WITH NON-BLOCKING FINDINGS, or FAIL against this immutable SHA. Any later commit invalidates the review.

          Do not merge or production-release. Physical Android installation, authenticated owner journey, owner-authorized promotion, and production verification remain separate gates.
          EOF
          )
          existing="$(gh api --paginate "repos/$REPOSITORY/issues/54/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$REPOSITORY/issues/54/comments" -f body="$body" >/dev/null
          fi
