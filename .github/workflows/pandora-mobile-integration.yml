name: FlutterFlow integration bridge executor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Extract reviewed FlutterFlow patch
        shell: python
        run: |
          from pathlib import Path
          text = Path(".github/workflows/flutterflow-full-integration.yml").read_text()
          start_marker = "      - name: Extend FlutterFlow Project API provider\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Verify exact candidate\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit("reviewed FlutterFlow patch markers missing")
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = block.splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("/tmp/flutterflow_patch.py").write_text(script)
          compile(script, "/tmp/flutterflow_patch.py", "exec")

      - name: Apply to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B codex/flutterflow-full-integration-20260814 origin/main
          python /tmp/flutterflow_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path("test/flutterflow-full-integration.test.js")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "baseUrl: https://api.flutterflow.io/v2,",
                  'baseUrl: "https://api.flutterflow.io/v2",',
              )
              p.write_text(s)
          PY

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --check

      - name: Publish review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Banatao Systems ProjectOS"
          git config user.email "projectos@users.noreply.github.com"
          git add src/tools/flutterflow.js src/runtime/tool-manifest.js vercel.json test/flutterflow-full-integration.test.js docs/integrations/FLUTTERFLOW_READINESS_PROVIDER.md
          git commit -m "feat: govern full FlutterFlow Project API integration"
          git push --force-with-lease origin codex/flutterflow-full-integration-20260814
