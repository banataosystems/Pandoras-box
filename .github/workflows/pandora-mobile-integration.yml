name: Pandora mobile integration

on:
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-mobile-integration.yml'
      - 'assets/brand/pandoras-box/product-mark/**'
      - 'scripts/verify-pandora-brand-assets.mjs'
      - 'scripts/check-private-key-literals.sh'
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Generate review candidates instead of comparing baselines
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify approved brand assets
        run: node scripts/verify-pandora-brand-assets.mjs
      - name: Generate transparent mobile-mark review candidate
        shell: bash
        run: |
          set -euo pipefail
          source=apps/pandora-mobile/assets/brand/pandora-product-mark-ui-1024.png
          output=.pandora-mobile-brand-candidate/pandora-product-mark-transparent-1024.png
          mkdir -p "$(dirname "$output")"
          convert "$source" \
            -colorspace Gray \
            \( +clone -negate \) \
            -alpha off -compose CopyOpacity -composite \
            -fill white -colorize 100 \
            "$output"
          dimensions="$(identify -format '%wx%h' "$output")"
          channels="$(identify -format '%[channels]' "$output")"
          corner_alpha="$(convert "$output" -format '%[fx:a.p{0,0}]' info:)"
          test "$dimensions" = '1024x1024'
          case "$channels" in
            *a*) ;;
            *) echo "Transparent mark candidate has no alpha channel: $channels" >&2; exit 1 ;;
          esac
          awk -v alpha="$corner_alpha" 'BEGIN { exit !(alpha <= 0.001) }'
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "candidate_sha256=$(sha256sum "$output" | cut -d ' ' -f1)"
            echo "dimensions=${dimensions}"
            echo "channels=${channels}"
            echo "corner_alpha=${corner_alpha}"
            echo "review_status=unapproved_candidate"
          } > .pandora-mobile-brand-candidate/manifest.txt
      - name: Upload transparent mobile-mark review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-transparent-mark-candidate
          path: .pandora-mobile-brand-candidate
          if-no-files-found: error
          include-hidden-files: true
      - name: Scan exact mobile source for private keys
        run: >-
          bash scripts/check-private-key-literals.sh
          apps/pandora-mobile
          assets/brand/pandoras-box/product-mark
          .github/workflows/pandora-mobile-integration.yml
          scripts/verify-pandora-brand-assets.mjs
          scripts/check-private-key-literals.sh
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materialize disposable Flutter platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          # The generated Android theme uses a platform-default window
          # background that appears black behind translucent Flutter regions.
          # Overlay the deterministic Porcelain/Graphite window underlay.
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          # Kept alongside the tests so the canvas parity guard can compare the
          # Android window underlay against the Dart tokens.
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          if [[ -f ../apps/pandora-mobile/pubspec.lock ]]; then
            cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          fi
      - name: Resolve dependencies
        working-directory: .pandora-mobile-build
        run: |
          set -euo pipefail
          test -f pubspec.lock
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Check formatting
        working-directory: .pandora-mobile-build
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: .pandora-mobile-build
        run: flutter analyze
      - name: Test and compare goldens
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_goldens != true }}
        working-directory: .pandora-mobile-build
        run: flutter test --reporter expanded
      - name: Generate golden review candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens == true }}
        working-directory: .pandora-mobile-build
        run: |
          flutter test --update-goldens test/goldens/foundation_catalog_golden_test.dart
          flutter test --reporter expanded
      - name: Verify owner-screen visual evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=.pandora-mobile-build/build/owner-screen-evidence
          manifest=.pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          test -d "$evidence"
          mapfile -d '' files < <(
            find "$evidence" -type f -name '*.png' -print0 | sort -z
          )
          test "${#files[@]}" -eq 15
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "evidence_class=synthetic_fixture_production_screens"
            echo "contains_credentials=false"
            echo "screen_count=${#files[@]}"
            for file in "${files[@]}"; do
              sha256sum "$file"
            done
          } > "$manifest"
      - name: Upload owner-screen visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-owner-screen-evidence
          path: |
            .pandora-mobile-build/build/owner-screen-evidence
            .pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          if-no-files-found: error
          include-hidden-files: true
      - name: Build web
        working-directory: .pandora-mobile-build
        run: flutter build web --release --dart-define=PANDORA_SOURCE_REVISION=${{ env.SOURCE_SHA }}
      - name: Build Android debug APK
        working-directory: .pandora-mobile-build
        run: flutter build apk --debug --dart-define=PANDORA_SOURCE_REVISION=${{ env.SOURCE_SHA }}
      - name: Inspect Android package and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          evidence=.pandora-mobile-build/android-package-evidence
          mkdir -p "$evidence"
          aapt="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          if grep -Eiq \
            'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)' \
            "$evidence/permissions.txt"; then
            echo "Unexpected sensitive Android permission detected." >&2
            exit 1
          fi
      - name: Write test-only artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          apk=.pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          web=.pandora-mobile-build/build/web
          visual=.pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          android_evidence=.pandora-mobile-build/android-package-evidence
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "flutter_version=3.47.0"
            echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')"
            echo "app_version=$(awk '/^version:/{print $2; exit}' .pandora-mobile-build/pubspec.yaml)"
            echo "lock_sha256=$(sha256sum .pandora-mobile-build/pubspec.lock | cut -d ' ' -f1)"
            echo "artifact_class=test-only"
            echo "production_release=false"
            echo "signing_class=android-debug"
            echo "store_release_eligible=false"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "web_tree_sha256=$(find "$web" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
            echo "web_files=$(find "$web" -type f | wc -l | tr -d ' ')"
            echo "visual_evidence_manifest_sha256=$(sha256sum "$visual" | cut -d ' ' -f1)"
            echo "visual_screen_count=$(awk -F= '$1 == "screen_count" {print $2}' "$visual")"
            echo "android_badging_sha256=$(sha256sum "$android_evidence/badging.txt" | cut -d ' ' -f1)"
            echo "android_permissions_sha256=$(sha256sum "$android_evidence/permissions.txt" | cut -d ' ' -f1)"
          } > .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
      - name: Upload golden review candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-golden-candidates
          path: |
            .pandora-mobile-build/test/goldens/**/*.png
            .pandora-mobile-build/pubspec.lock
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload golden failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-golden-failures
          path: |
            .pandora-mobile-build/test/failures/**/*.png
            .pandora-mobile-build/test/goldens/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web
          path: |
            .pandora-mobile-build/build/web
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          include-hidden-files: true
      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-android-debug
          path: |
            .pandora-mobile-build/build/app/outputs/flutter-apk/app-debug.apk
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          include-hidden-files: true
