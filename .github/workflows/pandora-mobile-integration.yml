name: Pandora mobile integration

on:
  push:
    branches:
      - 'integration/pandora-mobile-p1-current-main-20260819'
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-mobile-integration.yml'
      - 'assets/brand/pandoras-box/product-mark/**'
      - 'scripts/verify-pandora-brand-assets.mjs'
      - 'scripts/create-transparent-pandora-mark.py'
  pull_request:
    paths:
      - 'apps/pandora-mobile/**'
      - '.github/workflows/pandora-mobile-integration.yml'
      - 'assets/brand/pandoras-box/product-mark/**'
      - 'scripts/verify-pandora-brand-assets.mjs'
      - 'scripts/create-transparent-pandora-mark.py'
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Generate reviewed foundation candidates instead of only comparing baselines
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOLDENS_UPDATED: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens == true && 'true' || 'false' }}
      OWNER_TEST_FILENAME: pandora-mobile-0.3.0-rc.2-owner-test.apk
      EXPECTED_APP_VERSION: 0.3.0-rc.2+5
    steps:
      - name: Register exact-head evidence run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state='pending' \
            -f context='Pandora Mobile exact-head' \
            -f description='Owner-test verification is running.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify approved brand assets
        run: node scripts/verify-pandora-brand-assets.mjs
      - name: Reproduce and verify transparent mobile mark
        shell: bash
        run: |
          set -euo pipefail
          source=assets/brand/pandoras-box/product-mark/derived/ui-mark-1024.png
          canonical=assets/brand/pandoras-box/product-mark/derived/ui-mark-transparent-1024.png
          app_asset=apps/pandora-mobile/assets/brand/pandora-product-mark-ui-1024.png
          output=.pandora-mobile-brand-candidate/pandora-product-mark-transparent-1024.png
          mkdir -p "$(dirname "$output")"
          python3 scripts/create-transparent-pandora-mark.py \
            "$source" \
            "$output" \
            --manifest .pandora-mobile-brand-candidate/manifest.json
          cmp "$output" "$canonical"
          cmp "$canonical" "$app_asset"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "candidate_sha256=$(sha256sum "$output" | cut -d ' ' -f1)"
            echo "canonical_sha256=$(sha256sum "$canonical" | cut -d ' ' -f1)"
            echo "review_status=verified_exact_canonical"
          } > .pandora-mobile-brand-candidate/source.txt
      - name: Upload transparent mobile-mark verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-transparent-mark-evidence
          path: .pandora-mobile-brand-candidate
          if-no-files-found: error
          include-hidden-files: true
      - name: Scan exact Pandora Mobile source for private keys
        shell: bash
        run: >-
          bash apps/pandora-mobile/tool/check_private_key_literals.sh
          apps/pandora-mobile
          assets/brand/pandoras-box/product-mark
          .github/workflows/pandora-mobile-integration.yml
          scripts/verify-pandora-brand-assets.mjs
          scripts/create-transparent-pandora-mark.py
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materialize disposable Flutter platforms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          cp -R ../apps/pandora-mobile/platform/android/. ./android/
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp -R ../apps/pandora-mobile/docs ./docs
          cp -R ../apps/pandora-mobile/platform ./platform
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          test -f ../apps/pandora-mobile/pubspec.lock
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          python3 ../apps/pandora-mobile/tool/configure_owner_test_android.py \
            android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies without lock drift
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected
      - name: Check formatting
        working-directory: .pandora-mobile-build
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: .pandora-mobile-build
        run: flutter analyze
      - name: Test and compare committed goldens
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_goldens != true }}
        working-directory: .pandora-mobile-build
        run: flutter test --reporter expanded
      - name: Generate foundation golden review candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens == true }}
        working-directory: .pandora-mobile-build
        run: |
          flutter test --update-goldens test/goldens/foundation_catalog_golden_test.dart
          flutter test --reporter expanded
      - name: Verify production-widget visual evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=.pandora-mobile-build/build/owner-screen-evidence
          baselines=.pandora-mobile-build/test/goldens/owner_screens
          manifest=.pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          test -d "$evidence"
          mapfile -d '' files < <(
            find "$evidence" -type f -name '*.png' -print0 | sort -z
          )
          test "${#files[@]}" -eq 15
          if [[ -d "$baselines" ]]; then
            baseline_count=$(find "$baselines" -type f -name '*.png' | wc -l | tr -d ' ')
          else
            baseline_count=0
          fi
          if [[ "$GOLDENS_UPDATED" == "false" && "$baseline_count" -eq 15 ]]; then
            comparison=exact_committed_baseline_compare
          elif [[ "$GOLDENS_UPDATED" == "true" ]]; then
            comparison=golden_update_dispatch
          else
            comparison=capture_only_baselines_pending
          fi
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "evidence_class=fixture_backed_production_widget_render"
            echo "runner_class=headless_flutter_test"
            echo "physical_device=false"
            echo "authenticated_live_backend=false"
            echo "contains_credentials=false"
            echo "goldens_updated=${GOLDENS_UPDATED}"
            echo "baseline_comparison=${comparison}"
            echo "baseline_count=${baseline_count}"
            echo "screen_count=${#files[@]}"
            for file in "${files[@]}"; do
              sha256sum "$file"
            done
          } > "$manifest"
      - name: Upload production-widget visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-owner-screen-evidence
          path: |
            .pandora-mobile-build/build/owner-screen-evidence
            .pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          if-no-files-found: error
          include-hidden-files: true
      - name: Build maintained web candidate
        working-directory: .pandora-mobile-build
        run: >-
          flutter build web --release
          --dart-define=PANDORA_SOURCE_REVISION=${{ env.SOURCE_SHA }}
          --dart-define=PANDORA_RELEASE_SHA=${{ env.SOURCE_SHA }}
          --dart-define=PANDORA_APP_VERSION=${{ env.EXPECTED_APP_VERSION }}
      - name: Build Android Owner Test APK
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = "$EXPECTED_APP_VERSION"
          flutter build apk --release \
            --dart-define=PANDORA_SOURCE_REVISION=${SOURCE_SHA} \
            --dart-define=PANDORA_RELEASE_SHA=${SOURCE_SHA} \
            --dart-define=PANDORA_APP_VERSION=${EXPECTED_APP_VERSION}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${OWNER_TEST_FILENAME}"
      - name: Inspect Android identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=".pandora-mobile-build/build/app/outputs/flutter-apk/${OWNER_TEST_FILENAME}"
          evidence=.pandora-mobile-build/android-package-evidence
          mkdir -p "$evidence"
          aapt="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$aapt"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$evidence/apksigner.txt"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$evidence/apksigner.txt"
          grep -Eq '^Signer #1 certificate DN: .*CN=Android Debug' \
            "$evidence/apksigner.txt"
          signer_cert_sha256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              "$evidence/apksigner.txt" |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          [[ "$signer_cert_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$signer_cert_sha256" > \
            "$evidence/signing-certificate-sha256.txt"
          "$aapt" dump badging "$apk" > "$evidence/badging.txt"
          "$aapt" dump permissions "$apk" > "$evidence/permissions.txt"
          grep -Fq "package: name='com.banataosystems.pandora_mobile'" "$evidence/badging.txt"
          grep -Fq "versionCode='5'" "$evidence/badging.txt"
          grep -Fq "versionName='0.3.0-rc.2'" "$evidence/badging.txt"
          grep -Fq "application-label:'Pandora'" "$evidence/badging.txt"
          if grep -Eiq \
            'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|CAMERA|RECORD_AUDIO|BLUETOOTH_(SCAN|CONNECT|ADVERTISE)|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW' \
            "$evidence/permissions.txt"; then
            echo "Unexpected sensitive Android permission detected." >&2
            exit 1
          fi
      - name: Write Owner Test artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          apk=".pandora-mobile-build/build/app/outputs/flutter-apk/${OWNER_TEST_FILENAME}"
          web=.pandora-mobile-build/build/web
          visual=.pandora-mobile-build/pandora-mobile-owner-screen-evidence-manifest.txt
          android_evidence=.pandora-mobile-build/android-package-evidence
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "flutter_version=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
            echo "dart_version=$(dart --version 2>&1 | awk '{print $4}')"
            echo "app_version=$(awk '/^version:/{print $2; exit}' .pandora-mobile-build/pubspec.yaml)"
            echo "lock_sha256=$(sha256sum .pandora-mobile-build/pubspec.lock | cut -d ' ' -f1)"
            echo "artifact_class=owner-test-pre-release"
            echo "release_channel=github-prerelease"
            echo "production_release=false"
            echo "build_mode=release"
            echo "signing_class=android-debug-key"
            echo "signing_scheme_v2_verified=true"
            echo "signing_certificate_sha256=$(cat "$android_evidence/signing-certificate-sha256.txt")"
            echo "signing_key_stability=ephemeral-ci-debug"
            echo "fresh_install_only=true"
            echo "in_place_update_eligible=false"
            echo "rollback_install_mode=uninstall-reinstall"
            echo "rollback_preserves_local_app_state=false"
            echo "store_release_eligible=false"
            echo "physical_device_verified=false"
            echo "authenticated_owner_journey_verified=false"
            echo "independent_review_status=pending"
            echo "posthog_binding=disabled_without_dedicated_pandora_mobile_project"
            echo "apk_filename=${OWNER_TEST_FILENAME}"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "web_tree_sha256=$(find "$web" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
            echo "web_files=$(find "$web" -type f | wc -l | tr -d ' ')"
            echo "visual_evidence_manifest_sha256=$(sha256sum "$visual" | cut -d ' ' -f1)"
            echo "visual_screen_count=$(awk -F= '$1 == "screen_count" {print $2}' "$visual")"
            echo "visual_baseline_count=$(awk -F= '$1 == "baseline_count" {print $2}' "$visual")"
            echo "goldens_updated=${GOLDENS_UPDATED}"
            echo "android_badging_sha256=$(sha256sum "$android_evidence/badging.txt" | cut -d ' ' -f1)"
            echo "android_permissions_sha256=$(sha256sum "$android_evidence/permissions.txt" | cut -d ' ' -f1)"
            echo "android_apksigner_sha256=$(sha256sum "$android_evidence/apksigner.txt" | cut -d ' ' -f1)"
          } > .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
      - name: Upload foundation golden review candidates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-golden-candidates
          path: |
            .pandora-mobile-build/test/goldens/**/*.png
            .pandora-mobile-build/pubspec.lock
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload golden failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-golden-failures
          path: |
            .pandora-mobile-build/test/failures/**/*.png
            .pandora-mobile-build/test/goldens/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload web Owner Test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-web-owner-test
          path: |
            .pandora-mobile-build/build/web
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          include-hidden-files: true
      - name: Upload Android Owner Test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-android-owner-test
          path: |
            .pandora-mobile-build/build/app/outputs/flutter-apk/${{ env.OWNER_TEST_FILENAME }}
            .pandora-mobile-build/pandora-mobile-artifact-manifest.txt
            .pandora-mobile-build/android-package-evidence
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish exact-head verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              state='success'
              description='Owner-test format, analysis, tests, visuals, web, and Android passed.'
              ;;
            failure)
              state='failure'
              description='Owner-test verification failed. Open the exact run for evidence.'
              ;;
            *)
              state='error'
              description='Owner-test verification did not complete.'
              ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context='Pandora Mobile exact-head' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
