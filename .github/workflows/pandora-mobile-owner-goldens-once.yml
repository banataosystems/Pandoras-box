name: Pandora mobile reviewed owner goldens

on:
  pull_request:
    paths:
      - '.github/workflows/pandora-mobile-owner-goldens-once.yml'

permissions:
  contents: write

jobs:
  update-reviewed-owner-goldens:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pandora-mobile-owner-outcome-p0-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/pandora-mobile-owner-outcome-p0-20260820
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materialize locked package context
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pandora-mobile
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected
      - name: Update reviewed owner-screen baselines only
        working-directory: apps/pandora-mobile
        run: flutter test --update-goldens test/goldens/owner_screens_visual_evidence_test.dart
      - name: Commit changed reviewed baselines and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pandora-mobile-owner-goldens-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/test/goldens/owner_screens .github/workflows/pandora-mobile-owner-goldens-once.yml
          git diff --cached --name-only
          git commit -m 'test(mobile): accept reviewed owner-outcome goldens'
          git push origin HEAD:fix/pandora-mobile-owner-outcome-p0-20260820
