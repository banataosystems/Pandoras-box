name: Capture FlutterFlow patch execution error

on:
  push:
    branches:
      - codex/flutterflow-full-integration-candidate-20260814
    paths:
      - .github/workflows/flutterflow-patch-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose reviewed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/flutterflow-full-integration-candidate-20260814
          HELPER_BRANCH: codex/flutterflow-readiness-provider
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git config user.name "Banatao Systems ProjectOS"
          git config user.email "projectos@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "refs/heads/${TARGER_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" "refs/heads/${HELPER_BRANCH}:refs/remotes/origin/${HELPER_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          git show "refs/remotes/origin/${HELPER_BRANCH}:.github/workflows/flutterflow-full-integration.yml" > /tmp/helper.yml
          awk '
            /^      - name: Extend FlutterFlow Project API provider$/ { step=1; next }
            step && /^        run: \|$/ { body=1; next }
            body && /^      - name:/ { exit }
            body {
              if (substr($0,1,10) == "          ") print substr($0,11);
              else print $0;
            }
          ' /tmp/helper.yml > /tmp/apply.py
          mkdir -p recovery/evidence/flutterflow
          {
            echo "branch_head=$(git rev-parse HEAD)"
            echo "helper_head=$(git rev-parse refs/remotes/origin/${HELPER_BRANCH})"
            echo "apply_bytes=$(wc -c < /tmp/apply.py)"
            printf 'first_line='
            head -n 1 /tmp/apply.py
            for marker in \
              flutterflow.list-files \
              flutterflow.read-project-yaml \
              flutterflow.validate-project-yaml \
              flutterflow.update-project-yaml
            do
              if grep -F "$marker" /tmp/apply.py >/dev/null; then
                echo "marker_${marker}=present"
              else
                echo "marker_${marker}=missing"
              fi
            done
            set +e
            python /tmp/apply.py >/tmp/patch-stdout.txt 2>/tmp/patch-stderr.txt
            status=$?
            set -e
            echo "python_status=$status"
            echo "--- stdout ---"
            cat /tmp/patch-stdout.txt
            echo "--- stderr ---"
            cat /tmp/patch-stderr.txt
          } > recovery/evidence/flutterflow/candidate-patch-exception.txt
          git add recovery/evidence/flutterflow/candidate-patch-exception.txt
          git commit -m "evidence: capture FlutterFlow patch execution error"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
