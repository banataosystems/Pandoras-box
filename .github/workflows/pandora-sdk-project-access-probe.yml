name: Pandora SDK Project Access Probe

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-sdk-project-access-probe.yml

permissions:
  contents: write

jobs:
  expand-project-access-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Add App/project access patterns to inspection-only probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('automation/flutterflow/dsl/10_owner_api_state_navigation.dart')
          text = path.read_text()
          old = """      if (!lines[i].contains('updateApiEndpoint') &&\n          !lines[i].contains('updateApiGroup')) {\n        continue;\n      }\n"""
          new = """      final probeLine = lines[i];\n      if (!probeLine.contains('updateApiEndpoint') &&\n          !probeLine.contains('updateApiGroup') &&\n          !probeLine.contains('class App') &&\n          !probeLine.contains('FFProject get project') &&\n          !probeLine.contains('final FFProject project') &&\n          !probeLine.contains('flutterFlowAI')) {\n        continue;\n      }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one probe predicate, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit expanded inspection predicate
        run: |
          git config user.name 'Pandora SDK Probe'
          git config user.email 'pandora-sdk-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Probe signed SDK project access contract'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
