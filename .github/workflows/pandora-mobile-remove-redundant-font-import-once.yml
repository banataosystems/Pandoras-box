name: Pandora mobile remove redundant font import once

on:
  push:
    branches:
      - integration/pandora-mobile-p1-current-main-20260819
    paths:
      - '.github/pandora-mobile-remove-redundant-font-import-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Remove exactly one redundant import and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart')
          text = path.read_text()
          target = "import 'dart:typed_data';\n"
          if text.count(target) != 1:
              raise SystemExit('Expected exactly one redundant typed_data import.')
          path.write_text(text.replace(target, ''))
          Path('.github/workflows/pandora-mobile-remove-redundant-font-import-once.yml').unlink()
          Path('.github/pandora-mobile-remove-redundant-font-import-trigger').unlink()
          PY
          git diff --check
      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pandora Mobile Worker 5'
          git config user.email 'lawbatalla@gmail.com'
          git add apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart \
            .github/workflows/pandora-mobile-remove-redundant-font-import-once.yml \
            .github/pandora-mobile-remove-redundant-font-import-trigger
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'test(mobile): remove redundant visual font import'
          git push origin "HEAD:${GITHUB_REF_NAME}"
