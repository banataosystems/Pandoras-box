name: Pandora Users access source remediation

on:
  push:
    branches:
      - 'feat/pandora-users-access-v1-20260820'

permissions:
  contents: write

jobs:
  remediate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply bounded analyzer remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/pandora-mobile/lib/app/pandora_app.dart')
          source = app.read_text()
          source = source.replace(
              "import '../core/data/pandora_repository.dart';\n",
              "import '../core/data/pandora_repository.dart';\nimport '../core/data/user_access_repository.dart';\n",
          )
          source = source.replace(
              "    required this.repository,\n    required this.diagnostics,\n",
              "    required this.repository,\n    required this.diagnostics,\n    required this.userAccessRepository,\n",
          )
          source = source.replace(
              "  final DiagnosticsStore diagnostics;\n",
              "  final DiagnosticsStore diagnostics;\n  final UserAccessRepository userAccessRepository;\n",
          )
          source = source.replace(
              "        diagnostics: widget.diagnostics,\n        child: MaterialApp(",
              "        diagnostics: widget.diagnostics,\n        userAccessRepository: widget.userAccessRepository,\n        child: MaterialApp(",
          )
          app.write_text(source)

          screen = Path('apps/pandora-mobile/lib/features/users_access/users_access_screen.dart')
          source = screen.read_text()
          source = source.replace(
              "DropdownButtonFormField<PandoraMemberRole>(\n            value: _role,",
              "DropdownButtonFormField<PandoraMemberRole>(\n            initialValue: _role,",
          )
          source = source.replace(
              "DropdownButtonFormField<MembershipAccessStatus>(\n              value: _status,",
              "DropdownButtonFormField<MembershipAccessStatus>(\n              initialValue: _status,",
          )
          screen.write_text(source)
          PY
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Canonicalize in resolved package context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib/app/pandora_app.dart lib/features/users_access/users_access_screen.dart
          cp lib/app/pandora_app.dart ../apps/pandora-mobile/lib/app/pandora_app.dart
          cp lib/features/users_access/users_access_screen.dart ../apps/pandora-mobile/lib/features/users_access/users_access_screen.dart
          cd ..
      - name: Commit exact remediation if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/pandora-mobile/lib/app/pandora_app.dart \
            apps/pandora-mobile/lib/features/users_access/users_access_screen.dart; then
            echo 'Bounded analyzer remediation already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/pandora-mobile/lib/app/pandora_app.dart \
            apps/pandora-mobile/lib/features/users_access/users_access_screen.dart
          git commit -m 'fix(mobile): wire Users access dependency and analyzer cleanups'
          git push origin "HEAD:${GITHUB_REF_NAME}"
