name: Pandora package-context format apply

on:
  push:
    branches:
      - 'feat/pandora-users-access-v1-20260820'

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materialize the same resolved Flutter package context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          test -f ../apps/pandora-mobile/pubspec.lock
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected
      - name: Apply package-context canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          build=.pandora-mobile-build
          files=(
            core/data/user_access_repository.dart
            features/users_access/users_access_screen.dart
          )
          dart format \
            "$build/lib/${files[0]}" \
            "$build/lib/${files[1]}"
          cp "$build/lib/${files[0]}" "apps/pandora-mobile/lib/${files[0]}"
          cp "$build/lib/${files[1]}" "apps/pandora-mobile/lib/${files[1]}"
          if git diff --quiet -- \
            apps/pandora-mobile/lib/core/data/user_access_repository.dart \
            apps/pandora-mobile/lib/features/users_access/users_access_screen.dart; then
            echo 'Package-context formatting is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/pandora-mobile/lib/core/data/user_access_repository.dart \
            apps/pandora-mobile/lib/features/users_access/users_access_screen.dart
          git commit -m 'style(mobile): format Users & access in package context'
          git push origin "HEAD:${GITHUB_REF_NAME}"
