name: Reconcile Memory evidence client contract

on:
  push:
    branches:
      - feature/projectos-memory-evidence-intake
    paths:
      - '.github/workflows/memory-evidence-contract-reconcile.yml'
      - 'scripts/reconcile-memory-evidence-contract.js'

permissions:
  contents: write

jobs:
  reconcile:
    if: "github.event.head_commit.message == 'chore: reconcile Memory evidence contract'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconcile exact client contract
        run: node scripts/reconcile-memory-evidence-contract.js

      - name: Verify reconciliation
        run: |
          set -euo pipefail
          node -c src/tools/memory-evidence-intake.js
          node -c src/tools/memory.js
          node --test test/memory-evidence-intake.test.js
          npm run check
          npm test

      - name: Commit reconciled source and retire bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memory-evidence-contract-reconcile.yml
          git rm scripts/reconcile-memory-evidence-contract.js
          git add src/tools/memory-evidence-intake.js src/tools/memory.js test/memory-evidence-intake.test.js
          git diff --cached --check
          git commit -m "fix: align Memory evidence summary contract"
          git push origin HEAD:feature/projectos-memory-evidence-intake
