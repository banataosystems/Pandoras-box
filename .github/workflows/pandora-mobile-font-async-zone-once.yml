name: Pandora mobile font async zone once

on:
  push:
    branches:
      - integration/pandora-mobile-p1-current-main-20260819
    paths:
      - '.github/pandora-mobile-font-async-zone-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Isolate SDK font I/O in the real async zone and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart')
          text = path.read_text()
          old = '  await _loadVisualFont();\n  await setTestSurface(tester, logicalSize: visual.logicalSize);\n'
          new = """  if (!_visualFontLoaded) {
            await tester.runAsync(_loadVisualFont);
          }
          await setTestSurface(tester, logicalSize: visual.logicalSize);
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one visual font load call.')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/pandora-mobile-font-async-zone-once.yml').unlink()
          Path('.github/pandora-mobile-font-async-zone-trigger').unlink()
          PY
          git diff --check
          grep -Fq 'await tester.runAsync(_loadVisualFont);' apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart
      - name: Commit exact test-harness repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pandora Mobile Worker 5'
          git config user.email 'lawbatalla@gmail.com'
          git add apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart \
            .github/workflows/pandora-mobile-font-async-zone-once.yml \
            .github/pandora-mobile-font-async-zone-trigger
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'test(mobile): load visual font in real async zone'
          git push origin "HEAD:${GITHUB_REF_NAME}"
