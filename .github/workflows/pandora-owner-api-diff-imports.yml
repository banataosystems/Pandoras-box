name: Pandora Owner API Diff Imports

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-owner-api-diff-imports.yml

permissions:
  contents: write

jobs:
  patch-probe-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Add only the verified SDK modules used by the read-only probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('automation/flutterflow/dsl/10_owner_api_state_navigation.dart')
          text = path.read_text()
          marker = "import 'package:flutterflow_ai/flutterflow_ai.dart';\n"
          insert = """import 'package:flutterflow_ai/flutterflow_ai.dart';
import 'package:flutterflow_ai/src/client/flutterflow_ai_client.dart'
    show FlutterFlowAI;
import 'package:flutterflow_ai/src/helpers/api_helpers.dart'
    show findApiEndpoint, findApiGroup;
"""
          if text.count(marker) != 1:
              raise SystemExit(f'expected one SDK barrel import, found {text.count(marker)}')
          if 'flutterflow_ai_client.dart' in text or 'findApiEndpoint, findApiGroup' in text:
              raise SystemExit('temporary diff imports already present')
          path.write_text(text.replace(marker, insert, 1))
          PY
          git diff --check
      - name: Commit temporary verified imports
        run: |
          git config user.name 'Pandora API Diff Probe'
          git config user.email 'pandora-api-diff-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Expose verified SDK modules to owner API diff probe'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
