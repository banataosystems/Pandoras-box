name: Worker 1 apply independent-review fixes

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/worker1-apply-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: worker1-review-fixes-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/projectos-memory-supabase-contracts-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out triggering branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact independent-review corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/worker1_apply_review_fixes.py
          python <<'PY'
          from pathlib import Path
          path = Path("test/projectos-memory-supabase-contract-regression.test.js")
          text = path.read_text()
          old = 'assert.doesNotMatch(error.message, /rate_limited/);'
          new = 'assert.doesNotMatch(error.message, /"rate_limited"/);'
          if text.count(old) != 1:
              raise SystemExit("expected one raw 429 error assertion")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary automation from candidate tree
        run: |
          rm .github/workflows/worker1-apply-review-fixes.yml
          rm .github/scripts/worker1_apply_review_fixes.py

      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/worker1_apply_review_fixes.py' \
            '.github/workflows/worker1-apply-review-fixes.yml' \
            'src/projectos-mcp-handler.js' \
            'src/tools/memory-evidence-intake.js' \
            'test/projectos-memory-supabase-contract-regression.test.js' | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete source checks
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified corrections to the isolated lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(projectos): address independent review findings"
          git push origin "HEAD:refs/heads/fix/projectos-memory-supabase-contracts-20260819"
