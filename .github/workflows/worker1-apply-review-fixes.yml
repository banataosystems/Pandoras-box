name: Worker 1 apply independent-review fixes

on:
  push:
    branches:
      - fix/projectos-memory-supabase-contracts-20260819
    paths:
      - '.github/workflows/worker1-apply-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: worker1-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out triggering branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact independent-review corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("src/tools/memory-evidence-intake.js")
          source = source_path.read_text()

          source = replace_once(
              source,
              'const FAILURE_OPERATION = "memory.submitEvidenceCandidate";\n\nconst SAFE_BACKEND_FAILURES = new Map([',
              'const FAILURE_OPERATION = "memory.submitEvidenceCandidate";\n'
              'const EVIDENCE_PRIVACY_SCAN_VERSION = "evidence_privacy_v2";\n'
              'const MAX_RETRY_AFTER_MS = 86_400_000;\n\n'
              'const SAFE_BACKEND_FAILURES = new Map([',
              "privacy/retry constants",
          )

          source = replace_once(
              source,
              '''function failureEnvelope(input) {
  return Object.freeze({''',
              '''function retryableStatus(status) {
  return status === 408 || status === 429 || status >= 500;
}

function normalizeOuterFailureStatus(status) {
  return Number.isInteger(status) && status >= 400 && status < 500
    ? status
    : 502;
}

function responseRetryAfterMs(response) {
  const raw = response?.headers?.get?.("retry-after");
  if (typeof raw !== "string") return null;
  const value = raw.trim();
  if (/^\\d{1,9}$/.test(value)) {
    return Math.min(Number(value) * 1000, MAX_RETRY_AFTER_MS);
  }
  const parsed = Date.parse(value);
  if (!Number.isFinite(parsed)) return null;
  return Math.min(Math.max(parsed - Date.now(), 0), MAX_RETRY_AFTER_MS);
}

function failureEnvelope(input) {
  const retryAfterMs = Number.isInteger(input.retryAfterMs)
    && input.retryAfterMs >= 0
    && input.retryAfterMs <= MAX_RETRY_AFTER_MS
    ? input.retryAfterMs
    : null;
  return Object.freeze({''',
              "failure helpers",
          )

          source = replace_once(
              source,
              '''    retryable: input.retryable === true,
    correlationId: input.correlationId,''',
              '''    retryable: input.retryable === true,
    ...(retryAfterMs === null ? {} : { retryAfterMs }),
    correlationId: input.correlationId,''',
              "conditional retry-after envelope",
          )

          source = replace_once(
              source,
              '    this.status = input.outerStatus;',
              '    this.status = normalizeOuterFailureStatus(input.outerStatus);',
              "fail-closed outer status",
          )

          source = replace_once(
              source,
              'exports.IDEMPOTENCY_CONFLICT_CODE = IDEMPOTENCY_CONFLICT_CODE;\n',
              'exports.IDEMPOTENCY_CONFLICT_CODE = IDEMPOTENCY_CONFLICT_CODE;\n'
              'exports.EVIDENCE_PRIVACY_SCAN_VERSION = EVIDENCE_PRIVACY_SCAN_VERSION;\n',
              "privacy version export",
          )

          old_classifier = '''function safeBackendFailure(status, body) {
  const candidateCode = body?.error;
  const known = typeof candidateCode === "string"
    ? SAFE_BACKEND_FAILURES.get(candidateCode)
    : undefined;
  if (known) {
    return {
      safeErrorCode: candidateCode,
      validationCategory: known.validationCategory,
      retryable: known.retryable,
    };
  }
  if (status >= 500) {
    return {
      safeErrorCode: "provider_server_error",
      validationCategory: "provider_server",
      retryable: true,
    };
  }
  return {
    safeErrorCode: "memory_submission_failed",
    validationCategory: "unknown_downstream",
    retryable: false,
  };
}'''
          new_classifier = '''function safeBackendFailure(status, body) {
  const candidateCode = body?.error;
  if (status === 429) {
    return {
      safeErrorCode: "provider_rate_limited",
      validationCategory: "rate_limit",
      retryable: true,
    };
  }
  if (status === 408) {
    return {
      safeErrorCode: "provider_timeout",
      validationCategory: "timeout",
      retryable: true,
    };
  }
  if (status === 409) {
    if (candidateCode === IDEMPOTENCY_CONFLICT_CODE) {
      return {
        safeErrorCode: IDEMPOTENCY_CONFLICT_CODE,
        validationCategory: "idempotency",
        retryable: false,
      };
    }
    return {
      safeErrorCode: "provider_conflict",
      validationCategory: "downstream_conflict",
      retryable: false,
    };
  }
  const known = typeof candidateCode === "string"
    ? SAFE_BACKEND_FAILURES.get(candidateCode)
    : undefined;
  if (known) {
    return {
      safeErrorCode: candidateCode,
      validationCategory: known.validationCategory,
      retryable: known.retryable,
    };
  }
  if (status >= 500) {
    return {
      safeErrorCode: "provider_server_error",
      validationCategory: "provider_server",
      retryable: true,
    };
  }
  return {
    safeErrorCode: "memory_submission_failed",
    validationCategory: "unknown_downstream",
    retryable: false,
  };
}'''
          source = replace_once(source, old_classifier, new_classifier, "status classifier")

          source = replace_once(
              source,
              '''    validationCategory: input.validationCategory,
    retryable: input.retryable,
    correlationId: input.correlationId,''',
              '''    validationCategory: input.validationCategory,
    retryable: input.retryable,
    retryAfterMs: input.retryAfterMs,
    correlationId: input.correlationId,''',
              "retry-after submission plumbing",
          )

          source = replace_once(
              source,
              '''          "x-pandora-vercel-oidc": configuration.oidcToken,
          "x-request-id": correlationId,''',
              '''          "x-pandora-vercel-oidc": configuration.oidcToken,
          "x-request-id": correlationId,
          // Keep the strict candidate body unchanged while attesting which
          // privacy preflight cleared this request for provider/audit tracing.
          "x-pandora-privacy-scan-version": EVIDENCE_PRIVACY_SCAN_VERSION,''',
              "privacy scan attestation header",
          )

          count = source.count('retryable: response.status >= 500,')
          if count != 2:
              raise SystemExit(f"response-contract retryability: expected 2 matches, found {count}")
          source = source.replace(
              'retryable: response.status >= 500,',
              'retryable: retryableStatus(response.status),',
          )

          source = replace_once(
              source,
              '''    if (response.status === 409) {
      throw new MemoryEvidenceIdempotencyConflictError({
        correlationId: resolvedCorrelationId,
        timestamp: new Date().toISOString(),
      });
    }''',
              '''    if (
      response.status === 409
      && body?.error === IDEMPOTENCY_CONFLICT_CODE
    ) {
      throw new MemoryEvidenceIdempotencyConflictError({
        correlationId: resolvedCorrelationId,
        timestamp: new Date().toISOString(),
      });
    }''',
              "exact idempotency conflict gate",
          )

          source = replace_once(
              source,
              '''        ...classified,
        correlationId: resolvedCorrelationId,
        outerStatus: response.status >= 500 ? 502 : response.status,''',
              '''        ...classified,
        retryAfterMs: responseRetryAfterMs(response),
        correlationId: resolvedCorrelationId,
        outerStatus: normalizeOuterFailureStatus(response.status),''',
              "structured downstream failure",
          )

          source_path.write_text(source)

          handler_path = Path("src/projectos-mcp-handler.js")
          handler = handler_path.read_text()
          handler = replace_once(
              handler,
              '''    if (projectScopes.length === 0) {
        const isBoundedLegacyGrant = IDENTITY_SCOPES.every((scope) => granted.has(scope))''',
              '''    if (projectScopes.length === 0) {
        // Existing ChatGPT installations were consented before ProjectOS action
        // scopes existed. Keep only that exact identity grant compatible until
        // staged connector re-consent is complete; any broader or malformed
        // non-ProjectOS grant remains fail closed.
        const isBoundedLegacyGrant = IDENTITY_SCOPES.every((scope) => granted.has(scope))''',
              "legacy scope rationale",
          )
          handler_path.write_text(handler)

          test_path = Path("test/projectos-memory-supabase-contract-regression.test.js")
          tests = test_path.read_text()
          marker = 'test("body-level Memory failure can never surface as HTTP 2xx"'
          if marker in tests:
              raise SystemExit("review regression tests already present")
          tests += r'''

test("body-level Memory failure can never surface as HTTP 2xx", async () => {
  const args = evidenceArgs();
  let finishInput;
  const ledger = {
    async claimPlan(_token, planId) {
      return {
        planId,
        requestId: "55555555-5555-4555-8555-555555555555",
        tool: "memory.submitEvidenceCandidate",
        risk: "write",
        args,
        payloadHash: executionPayloadHash("memory.submitEvidenceCandidate", args),
        status: "executing",
      };
    },
    async finishPlan(_token, input) {
      finishInput = input;
      return { planId: input.planId, status: input.status };
    },
  };
  const handler = createProjectOsMcpHandler(handlerDependencies({
    ledger,
    toolConfiguration: () => memoryConfig,
    async execute(_name, receivedArgs, config) {
      return submitEvidenceCandidate(receivedArgs, config, async () =>
        new Response(JSON.stringify({
          ok: false,
          error: "evidence_candidate_invalid",
        }), {
          status: 200,
          headers: { "x-request-id": "body-failure-http-200" },
        }));
    },
  }));
  const response = responseRecorder();
  await handler(request("projectos_execute_plan", { planId: PLAN_ID }), response);

  assert.equal(response.statusCode, 502);
  assert.equal(finishInput.status, "failed");
  const callerFailure = JSON.parse(response.body.error.message);
  const auditFailure = JSON.parse(finishInput.error);
  assert.deepEqual(auditFailure, callerFailure);
  assert.equal(callerFailure.httpStatus, 200);
  assert.equal(callerFailure.safeErrorCode, "evidence_candidate_invalid");
  assert.equal(callerFailure.retryable, false);
});

test("429 remains retryable and carries a bounded Retry-After instruction", async () => {
  await assert.rejects(
    () => submitEvidenceCandidate(evidenceArgs(), memoryConfig, async () =>
      new Response(JSON.stringify({ ok: false, error: "rate_limited" }), {
        status: 429,
        headers: {
          "retry-after": "7",
          "x-request-id": "memory-rate-limit",
        },
      })),
    (error) => {
      assert.ok(error instanceof MemoryEvidenceSubmissionError);
      assert.equal(error.status, 429);
      const failure = JSON.parse(error.message);
      assert.equal(failure.httpStatus, 429);
      assert.equal(failure.safeErrorCode, "provider_rate_limited");
      assert.equal(failure.validationCategory, "rate_limit");
      assert.equal(failure.retryable, true);
      assert.equal(failure.retryAfterMs, 7000);
      assert.doesNotMatch(error.message, /rate_limited/);
      return true;
    },
  );
});

test("408 is classified as a retryable provider timeout", async () => {
  await assert.rejects(
    () => submitEvidenceCandidate(evidenceArgs(), memoryConfig, async () =>
      new Response(JSON.stringify({ ok: false, error: "private-timeout-detail" }), {
        status: 408,
      })),
    (error) => {
      assert.ok(error instanceof MemoryEvidenceSubmissionError);
      assert.equal(error.status, 408);
      const failure = JSON.parse(error.message);
      assert.equal(failure.httpStatus, 408);
      assert.equal(failure.safeErrorCode, "provider_timeout");
      assert.equal(failure.validationCategory, "timeout");
      assert.equal(failure.retryable, true);
      assert.equal("retryAfterMs" in failure, false);
      assert.doesNotMatch(error.message, /private-timeout-detail/);
      return true;
    },
  );
});

test("a non-idempotency 409 is a generic downstream conflict", async () => {
  await assert.rejects(
    () => submitEvidenceCandidate(evidenceArgs(), memoryConfig, async () =>
      new Response(JSON.stringify({
        ok: false,
        error: "candidate_already_promoted",
        detail: "private conflict detail",
      }), { status: 409 })),
    (error) => {
      assert.ok(error instanceof MemoryEvidenceSubmissionError);
      assert.equal(error instanceof MemoryEvidenceIdempotencyConflictError, false);
      assert.equal(error.status, 409);
      const failure = JSON.parse(error.message);
      assert.equal(failure.httpStatus, 409);
      assert.equal(failure.safeErrorCode, "provider_conflict");
      assert.equal(failure.validationCategory, "downstream_conflict");
      assert.equal(failure.retryable, false);
      assert.doesNotMatch(error.message, /candidate_already_promoted|private conflict/);
      return true;
    },
  );
});

test("privacy preflight version is attested without widening the strict body contract", async () => {
  const args = evidenceArgs();
  let privacyVersion;
  await submitEvidenceCandidate(args, memoryConfig, async (_url, init) => {
    privacyVersion = init.headers["x-pandora-privacy-scan-version"];
    return new Response(JSON.stringify(pendingReviewResponse(args)), { status: 201 });
  });
  assert.equal(privacyVersion, "evidence_privacy_v2");
});
'''
          test_path.write_text(tests)
          PY

      - name: Remove temporary workflow from the candidate tree
        shell: bash
        run: rm .github/workflows/worker1-apply-review-fixes.yml

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/worker1-apply-review-fixes.yml' \
            'src/projectos-mcp-handler.js' \
            'src/tools/memory-evidence-intake.js' \
            'test/projectos-memory-supabase-contract-regression.test.js' | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete source checks
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit exact reviewed corrections to the lane branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(projectos): address independent review findings"
          git push origin "HEAD:refs/heads/fix/projectos-memory-supabase-contracts-20260819"
