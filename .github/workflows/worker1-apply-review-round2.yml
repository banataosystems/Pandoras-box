name: Worker 1 apply second-round reliability fixes

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/worker1-apply-review-round2.yml'

permissions:
  contents: write

concurrency:
  group: worker1-round2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/projectos-memory-supabase-contracts-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact isolated lane head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact reviewed reliability corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/worker1_apply_review_round2.py
          python <<'PY'
          from pathlib import Path

          def repair_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one generated marker defect, found {count}")
              target.write_text(text.replace(old, new, 1))

          repair_once(
              "src/tools/memory-evidence-intake.js",
              "function safeCorrelationId]);\n\nfunction safeCorrelationId",
              "function safeCorrelationId",
              "safe-correlation marker",
          )
          repair_once(
              "src/tools/memory-evidence-intake.js",
              "function safeBackendFailurefunction safeBackendFailure",
              "function safeBackendFailure",
              "safe-backend marker",
          )
          repair_once(
              "src/tools/memory-evidence-intake.js",
              "function submissionFailurefunction submissionFailure",
              "function submissionFailure",
              "submission-failure marker",
          )
          repair_once(
              "src/projectos-mcp-handler.js",
              "function rpcResultfunction rpcResult",
              "function rpcResult",
              "rpc-result marker",
          )
          repair_once(
              "test/projectos-memory-supabase-contract-regression.test.js",
              'test("array-valued provider readstest("array-valued provider reads',
              'test("array-valued provider reads',
              "array-test marker",
          )
          PY

      - name: Remove temporary branch-only automation
        run: |
          rm .github/workflows/worker1-apply-review-round2.yml
          rm .github/scripts/worker1_apply_review_round2.py

      - name: Verify bounded candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            '.github/scripts/worker1_apply_review_round2.py' \
            '.github/workflows/worker1-apply-review-round2.yml' \
            'src/projectos-mcp-handler.js' \
            'src/runtime/execution-ledger-client.js' \
            'src/tools/memory-evidence-intake.js' \
            'test/execution-ledger-finalization-contract.test.js' \
            'test/projectos-memory-supabase-contract-regression.test.js' | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete source checks
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified corrections to the isolated lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(projectos): close reliability review gaps"
          git push origin "HEAD:refs/heads/fix/projectos-memory-supabase-contracts-20260819"
