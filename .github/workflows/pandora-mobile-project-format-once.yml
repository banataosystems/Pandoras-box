name: Pandora mobile package formatter

on:
  pull_request:
    paths:
      - '.github/workflows/pandora-mobile-project-format-once.yml'

permissions:
  contents: write

jobs:
  format-exact-package-and-remove-self:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source without stored credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve the exact package and format in package context
        working-directory: apps/pandora-mobile
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          rm pubspec.lock.expected
          dart format lib test
      - name: Commit formatter output and remove this one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/pandora-mobile-project-format-once.yml
          git add apps/pandora-mobile/lib apps/pandora-mobile/test \
            .github/workflows/pandora-mobile-project-format-once.yml
          git config user.name 'pandora-mobile-worker[bot]'
          git config user.email 'pandora-mobile-worker[bot]@users.noreply.github.com'
          git commit -m 'style(mobile): format the exact Flutter 3.47 package'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_BRANCH}"
