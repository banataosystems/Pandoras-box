name: Pandora Owner API Tests

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'automation/flutterflow/**'
      - 'recovery/overlay/**'
      - 'supabase/**'
      - 'docs/supabase/recovery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify deterministic Pandora source guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/pandora_p1_source_guard.py \
            automation/pandora_p2_design_guard.py \
            automation/pandora_p3_screen_guard.py
          python3 automation/pandora_p1_source_guard.py --check
          python3 automation/pandora_p2_design_guard.py --check
          python3 automation/pandora_p3_screen_guard.py --check
          git diff --check
      - name: Run contract and client tests
        run: node --experimental-strip-types --test recovery/overlay/*.test.ts
