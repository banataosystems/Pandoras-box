name: Pandora Owner API Tests

on:
  pull_request:
    paths:
      - '.github/workflows/pandora-owner-api-test.yml'
      - 'automation/flutterflow/**'
      - 'recovery/overlay/**'
      - 'supabase/functions/pandora-owner-api/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run contract and client tests
        run: node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Report the matching unattended workflow run
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          query = urllib.parse.urlencode({
              "branch": "feature/flutterflow-pandora-mobile-v1",
              "event": "push",
              "per_page": "20",
          })
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"flutterflow-unattended.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          matching = [run for run in runs if run.get("head_sha") == candidate_sha]
          print("UNATTENDED_RUN " + json.dumps([
              {
                  "id": run.get("id"),
                  "head_sha": run.get("head_sha"),
                  "run_attempt": run.get("run_attempt"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
              }
              for run in matching
          ], separators=(",", ":")))
          PY
