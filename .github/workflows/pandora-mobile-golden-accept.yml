name: Pandora mobile transparent golden acceptance

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-golden-accept.yml'

permissions:
  contents: write

jobs:
  accept:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Materialize acceptance package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock

      - name: Resolve locked dependencies
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Verify formatting and analysis
        working-directory: .pandora-mobile-build
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze

      - name: Refresh four governed golden baselines
        working-directory: .pandora-mobile-build
        run: flutter test --update-goldens test/goldens/foundation_catalog_golden_test.dart

      - name: Prove transparent pixels in all four goldens
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct, zlib

          names = [
              'foundation_graphite_360x800.png',
              'foundation_porcelain_360x800.png',
              'foundation_porcelain_320x800.png',
              'foundation_porcelain_2x_text.png',
          ]

          def paeth(a, b, c):
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          def alpha_counts(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path.name}: invalid PNG signature')
              pos = 8
              idat = []
              width = height = bit_depth = color_type = interlace = None
              while pos < len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  payload = data[pos+8:pos+8+length]
                  pos += 12 + length
                  if kind == b'IHDR':
                      width, height, bit_depth, color_type, _comp, _filter, interlace = struct.unpack('>IIBBBBB', payload)
                  elif kind == b'IDAT':
                      idat.append(payload)
                  elif kind == b'IEND':
                      break
              if bit_depth != 8 or color_type != 6 or interlace != 0:
                  raise SystemExit(f'{path.name}: expected non-interlaced 8-bit RGBA PNG')
              raw = zlib.decompress(b''.join(idat))
              bpp = 4
              stride = width * bpp
              prev = bytearray(stride)
              offset = 0
              transparent = 0
              fully_transparent = 0
              for _ in range(height):
                  f = raw[offset]
                  offset += 1
                  row = bytearray(raw[offset:offset+stride])
                  offset += stride
                  for i in range(stride):
                      a = row[i-bpp] if i >= bpp else 0
                      b = prev[i]
                      c = prev[i-bpp] if i >= bpp else 0
                      if f == 1:
                          row[i] = (row[i] + a) & 0xff
                      elif f == 2:
                          row[i] = (row[i] + b) & 0xff
                      elif f == 3:
                          row[i] = (row[i] + ((a + b) // 2)) & 0xff
                      elif f == 4:
                          row[i] = (row[i] + paeth(a, b, c)) & 0xff
                      elif f != 0:
                          raise SystemExit(f'{path.name}: unsupported PNG filter {f}')
                  for alpha in row[3::4]:
                      if alpha < 255:
                          transparent += 1
                      if alpha == 0:
                          fully_transparent += 1
                  prev = row
              return transparent, fully_transparent

          root = Path('test/goldens/baselines')
          for name in names:
              path = root / name
              transparent, fully = alpha_counts(path)
              print(f'{name}: alpha<255={transparent}, alpha=0={fully}')
              if transparent == 0:
                  raise SystemExit(f'{name}: no transparent pixels')
          PY

      - name: Run full Flutter suite
        working-directory: .pandora-mobile-build
        run: flutter test --reporter expanded

      - name: Build web
        working-directory: .pandora-mobile-build
        run: flutter build web --release

      - name: Build Android debug APK
        working-directory: .pandora-mobile-build
        run: flutter build apk --debug

      - name: Copy accepted baselines back
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/pandora-mobile/test/goldens/baselines
          cp -R .pandora-mobile-build/test/goldens/baselines apps/pandora-mobile/test/goldens/baselines
          git diff --check

      - name: Verify only governed golden paths changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              apps/pandora-mobile/test/goldens/baselines/foundation_graphite_360x800.png|\
              apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_360x800.png|\
              apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_320x800.png|\
              apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_2x_text.png) : ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit accepted transparent goldens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pandora-mobile/test/goldens/baselines
          git commit -m "test(mobile): accept transparent accessible golden baselines"
          git push origin HEAD:feature/pandora-mobile-premium-foundation
