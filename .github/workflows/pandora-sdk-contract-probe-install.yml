name: Pandora SDK Contract Probe Install

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-sdk-contract-probe-install.yml

permissions:
  contents: write

jobs:
  install-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install inspection-only probe
        run: |
          python3 -m py_compile automation/flutterflow/sdk_contract_probe.py
          python3 automation/flutterflow/sdk_contract_probe.py --install
          git diff --check
      - name: Commit probe source
        run: |
          git config user.name 'Pandora SDK Probe'
          git config user.email 'pandora-sdk-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Temporarily probe signed SDK update contract'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
