name: Pandora mobile formatter apply once

on:
  push:
    branches:
      - 'integration/pandora-mobile-p1-current-main-20260819'
    paths:
      - '.github/workflows/pandora-mobile-format-evidence-once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      BRANCH: integration/pandora-mobile-p1-current-main-20260819
      APP_DIR: apps/pandora-mobile
      TARGET: test/goldens/owner_screens_visual_evidence_test.dart
      TARGET_PATH: apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart
      WORKFLOW_PATH: .github/workflows/pandora-mobile-format-evidence-once.yml
      EVIDENCE_DIR: ${{ github.workspace }}/build/formatter-evidence
    steps:
      - name: Register exact formatter-apply run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state='pending' \
            -f context='Pandora Mobile formatter apply once' \
            -f description='Exact-head guarded formatter application is running.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check out exact source with bounded push credential
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Flutter formatter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Apply exact package-scoped formatting
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format "$TARGET"
      - name: Verify bounded two-path mutation and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$TARGET_PATH" ]]; then
            printf 'Unexpected pre-removal diff:\n' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check
          git diff -- "$TARGET_PATH" > "$EVIDENCE_DIR/formatter.patch"
          test -s "$EVIDENCE_DIR/formatter.patch"
          cp "$TARGET_PATH" "$EVIDENCE_DIR/formatted.dart"
          formatted_sha=$(sha256sum "$TARGET_PATH" | cut -d ' ' -f1)
          git add "$TARGET_PATH"
          git rm "$WORKFLOW_PATH"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("$WORKFLOW_PATH" "$TARGET_PATH")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${staged[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected staged paths:\n' >&2
            printf '%s\n' "${staged[@]}" >&2
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "formatted_sha256=$formatted_sha"
            echo "formatter=$(dart --version 2>&1)"
            echo "mutation_paths=$TARGET_PATH,$WORKFLOW_PATH"
            echo "mutation_capability=exact_two_path_fast_forward"
          } > "$EVIDENCE_DIR/manifest.txt"
      - name: Commit and fast-forward only if branch head is unchanged
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [[ "$remote_head" != "$SOURCE_SHA" ]]; then
            echo "Branch moved from $SOURCE_SHA to $remote_head; refusing to overwrite." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(mobile): apply pinned Dart formatting and remove helper'
          result_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "result_sha=$result_sha" >> "$GITHUB_OUTPUT"
          echo "result_sha=$result_sha" >> "$EVIDENCE_DIR/manifest.txt"
      - name: Upload immutable formatter-apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-dart-format-apply-evidence
          path: build/formatter-evidence
          if-no-files-found: warn
          include-hidden-files: true
      - name: Finalize formatter-apply status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RESULT_SHA: ${{ steps.apply.outputs.result_sha }}
        run: |
          set -euo pipefail
          state=failure
          description='Exact-head formatter application failed closed.'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Formatter applied and helper removed at ${RESULT_SHA}."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context='Pandora Mobile formatter apply once' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
