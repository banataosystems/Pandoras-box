name: Pandora P1 Source Guard v3

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-p1-source-guard-v3.yml

permissions:
  contents: write

jobs:
  harden-owner-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Repair formatting-sensitive Plan matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('automation/pandora_p1_source_guard.py')
          lines = path.read_text().splitlines(keepends=True)
          label_index = next((i for i, line in enumerate(lines) if '"plan copy",' in line), None)
          if label_index is None:
              raise SystemExit('plan copy matcher label not found')
          start = label_index
          while start >= 0 and 'text = replace_once(' not in lines[start]:
              start -= 1
          if start < 0:
              raise SystemExit('plan copy matcher start not found')
          end = label_index
          while end < len(lines) and lines[end].strip() != ')':
              end += 1
          if end >= len(lines):
              raise SystemExit('plan copy matcher end not found')
          replacement = '''    text = replace_once(
              text,
              "'Pandora plans first. The backend still enforces approval and the extra '",
              "'Pandora plans first. Approval and an extra identity check still apply '",
              "plan copy first line",
          )
          text = replace_once(
              text,
              "'identity check before protected changes.',",
              "'before protected changes.',",
              "plan copy second line",
          )
          '''
          path.write_text(''.join(lines[:start]) + replacement + ''.join(lines[end + 1:]))
          PY
          python3 -m py_compile automation/pandora_p1_source_guard.py
      - name: Apply versioned P1 guard
        run: python3 automation/pandora_p1_source_guard.py --apply
      - name: Verify source and existing owner tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 automation/pandora_p1_source_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified owner-surface hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pandora Source Guard'
          git config user.email 'pandora-source-guard@users.noreply.github.com'
          git add \
            automation/pandora_p1_source_guard.py \
            supabase/functions/pandora-owner-api/index.ts \
            automation/flutterflow/dsl/10_owner_api_state_navigation.dart \
            automation/flutterflow/dsl/selector_bindings.dart
          git commit -m 'Harden Pandora owner language firewall'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
