name: Format Pandora approvals once

on:
  push:
    branches:
      - integration/pandora-mobile-p1-current-main-20260819
    paths:
      - '.github/workflows/format-pandora-approvals-once.yml'

permissions:
  contents: write

concurrency:
  group: format-pandora-approvals-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format only the failing file
        shell: bash
        run: |
          set -euo pipefail
          target=apps/pandora-mobile/lib/features/approvals/approvals_screen.dart
          dart format "$target"
          changed="$(git diff --name-only)"
          test "$changed" = "$target"
      - name: Commit formatted source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-pandora-approvals-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No formatting changes found.'; exit 1; }
          git commit -m 'style(mobile): apply pinned Dart formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
