name: Pandora mobile transparent background autofix

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-transparent-background.yml'

permissions:
  contents: write

jobs:
  apply-transparent-background:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Make mobile shell background transparent
        shell: bash
        env:
          TRANSPARENT_GUARD_B64: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          theme_path = Path('apps/pandora-mobile/lib/core/design/pandora_theme.dart')
          theme = theme_path.read_text()
          light = 'background: const Color(0xFFF8F8FA),'
          dark = 'background: const Color(0xFF0D0E12),'
          nav = 'backgroundColor: surface,'

          if theme.count(light) != 1:
              raise SystemExit('Expected exactly one Porcelain background literal')
          if theme.count(dark) != 1:
              raise SystemExit('Expected exactly one Graphite background literal')
          if theme.count(nav) != 2:
              raise SystemExit('Expected exactly two navigation surface backgrounds')

          theme = theme.replace(light, 'background: Colors.transparent,')
          theme = theme.replace(dark, 'background: Colors.transparent,')
          theme = theme.replace(nav, 'backgroundColor: Colors.transparent,')

          if 'scaffoldBackgroundColor: background,' not in theme:
              raise SystemExit('Theme scaffold background contract changed unexpectedly')
          if 'backgroundColor: background,' not in theme:
              raise SystemExit('Theme app-bar background contract changed unexpectedly')
          theme_path.write_text(theme)

          app_path = Path('apps/pandora-mobile/lib/app/pandora_app.dart')
          app = app_path.read_text()
          anchor = "title: \"Pandora's Box\",\n"
          if app.count(anchor) != 1:
              raise SystemExit('MaterialApp title anchor changed unexpectedly')
          app = app.replace(
              anchor,
              anchor + '          color: Colors.transparent,\n',
          )
          app_path.write_text(app)

          test_path = Path(
              'apps/pandora-mobile/test/transparent_background_source_guard_test.dart'
          )
          test_path.write_bytes(base64.b64decode(os.environ['TRANSPARENT_GUARD_B64']))
          PY

      - name: Materialize acceptance-equivalent Flutter package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          test -f ../apps/pandora-mobile/pubspec.lock
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock

      - name: Resolve locked dependencies
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Format in acceptance package context
        working-directory: .pandora-mobile-build
        run: dart format lib test

      - name: Verify transparent background source contract
        working-directory: .pandora-mobile-build
        run: flutter test test/transparent_background_source_guard_test.dart

      - name: Analyze fixed mobile source
        working-directory: .pandora-mobile-build
        run: flutter analyze

      - name: Copy exact package-context formatter output back
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/pandora-mobile/lib apps/pandora-mobile/test
          cp -R .pandora-mobile-build/lib apps/pandora-mobile/lib
          cp -R .pandora-mobile-build/test apps/pandora-mobile/test
          git diff --check

      - name: Commit transparent background fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pandora-mobile/lib apps/pandora-mobile/test
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix(mobile): make Pandora background transparent"
          git push origin HEAD:feature/pandora-mobile-premium-foundation
