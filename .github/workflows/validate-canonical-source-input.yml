name: Validate canonical MCPMaster recovery input

on:
  pull_request:
    paths:
      - 'recovery/mcpmaster-source.part-*'
      - 'recovery/SOURCE_RECOVERY_MANIFEST.md'
      - '.github/workflows/recover-canonical-source.yml'
      - '.github/workflows/validate-canonical-source-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact recovery archive and required source
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03; do
            file="recovery/mcpmaster-source.part-${part}"
            test -s "$file"
            wc -c "$file"
            sha256sum "$file"
          done

          python - <<'PY'
          import hashlib
          import io
          import itertools
          import zipfile
          from pathlib import Path

          expected = "dd7a4d1f982698bfe008f376809253011e8436598860bd86600c17e31538af83"
          required = {
              "source/package.json",
              "source/src/http-server.ts",
              "source/SOURCE_AUTHORITY_POLICY.json",
          }
          parts = {
              name: Path(f"recovery/mcpmaster-source.part-{name}").read_bytes()
              for name in ("00", "01", "02", "03")
          }
          exact_matches = []
          valid_zips = []
          for order in itertools.permutations(parts):
              payload = b"".join(parts[name] for name in order)
              digest = hashlib.sha256(payload).hexdigest()
              is_zip = zipfile.is_zipfile(io.BytesIO(payload))
              detail = ""
              if is_zip:
                  with zipfile.ZipFile(io.BytesIO(payload)) as zf:
                      names = set(zf.namelist())
                      detail = f" entries={len(names)} required_present={required.issubset(names)}"
                  valid_zips.append((order, digest, payload, detail))
              print(f"order={','.join(order)} sha256={digest} valid_zip={is_zip}{detail}")
              if digest == expected:
                  exact_matches.append((order, payload))

          print(f"valid_zip_permutations={len(valid_zips)}")
          print(f"exact_hash_matches={len(exact_matches)}")
          if len(exact_matches) != 1:
              raise SystemExit(
                  f"content-addressed recovery blocked: expected one exact archive, found {len(exact_matches)}; valid zip permutations={len(valid_zips)}"
              )
          order, payload = exact_matches[0]
          Path("/tmp/mcpmaster-recovery-source.zip").write_bytes(payload)
          print(f"verified_part_order={','.join(order)}")
          PY

          rm -rf /tmp/mcpmaster-recovery
          mkdir -p /tmp/mcpmaster-recovery
          unzip -q /tmp/mcpmaster-recovery-source.zip -d /tmp/mcpmaster-recovery
          test -f /tmp/mcpmaster-recovery/source/package.json
          test -f /tmp/mcpmaster-recovery/source/src/http-server.ts
          test -f /tmp/mcpmaster-recovery/source/SOURCE_AUTHORITY_POLICY.json
          file_count="$(find /tmp/mcpmaster-recovery/source -type f | wc -l | tr -d ' ')"
          echo "recovered_source_files=${file_count}"
          test "$file_count" -ge 500
