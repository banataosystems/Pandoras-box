name: Validate canonical MCPMaster recovery input

on:
  pull_request:
    paths:
      - 'recovery/mcpmaster-source.part-*'
      - 'recovery/SOURCE_RECOVERY_MANIFEST.md'
      - 'recovery/evidence/diagnostics/pr171-dep0169-trace.patch'
      - '.github/workflows/recover-canonical-source.yml'
      - '.github/workflows/validate-canonical-source-input.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Prove exact recovery head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify exact preserved DEP0169 diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          patch='recovery/evidence/diagnostics/pr171-dep0169-trace.patch'
          test "$(wc -c < "$patch" | tr -d ' ')" = '860'
          printf '%s  %s\n' 'abcbd7040ef2a4ce02b96ae11e66d0734f2e4e419c66bf7781d9b2e43e0c0941' "$patch" | sha256sum -c -
      - name: Verify exact recovery archive and required source
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03; do
            file="recovery/mcpmaster-source.part-${part}"
            test -s "$file"
            wc -c "$file"
            sha256sum "$file"
          done

          python - <<'PY'
          import hashlib
          import io
          import itertools
          import struct
          import zipfile
          from pathlib import Path

          expected = "dd7a4d1f982698bfe008f376809253011e8436598860bd86600c17e31538af83"
          required = {
              "source/package.json",
              "source/src/http-server.ts",
              "source/SOURCE_AUTHORITY_POLICY.json",
          }
          required_suffixes = {
              "package.json",
              "src/http-server.ts",
              "SOURCE_AUTHORITY_POLICY.json",
          }
          names = ("00", "01", "02", "03")
          parts = {
              name: Path(f"recovery/mcpmaster-source.part-{name}").read_bytes()
              for name in names
          }
          local_sig = bytes.fromhex("504b0304")
          central_sig = bytes.fromhex("504b0102")
          eocd_sig = bytes.fromhex("504b0506")

          print("archive_part_diagnostics_begin")
          for name in names:
              payload = parts[name]
              print(
                  f"part={name} bytes={len(payload)} "
                  f"first16={payload[:16].hex()} last16={payload[-16:].hex()} "
                  f"local_headers={payload.count(local_sig)} "
                  f"central_headers={payload.count(central_sig)} "
                  f"eocd_headers={payload.count(eocd_sig)}"
              )

          canonical = b"".join(parts[name] for name in names)
          print(
              f"canonical_bytes={len(canonical)} "
              f"canonical_sha256={hashlib.sha256(canonical).hexdigest()} "
              f"local_headers={canonical.count(local_sig)} "
              f"central_headers={canonical.count(central_sig)} "
              f"eocd_headers={canonical.count(eocd_sig)}"
          )

          local_positions = []
          cursor = 0
          while True:
              pos = canonical.find(local_sig, cursor)
              if pos < 0:
                  break
              local_positions.append(pos)
              cursor = pos + 4

          local_entries = []
          for pos in local_positions:
              if pos + 30 > len(canonical):
                  local_entries.append((pos, "<truncated-header>", None, None, None))
                  continue
              try:
                  (
                      sig, version_needed, flags, method, mod_time, mod_date,
                      crc32, compressed_size, uncompressed_size,
                      filename_len, extra_len,
                  ) = struct.unpack_from("<4s5H3L2H", canonical, pos)
              except struct.error:
                  local_entries.append((pos, "<unparseable-header>", None, None, None))
                  continue
              name_start = pos + 30
              name_end = name_start + filename_len
              if name_end > len(canonical):
                  filename = "<truncated-filename>"
              else:
                  raw_name = canonical[name_start:name_end]
                  encoding = "utf-8" if flags & 0x800 else "cp437"
                  filename = raw_name.decode(encoding, errors="replace")
              local_entries.append((pos, filename, flags, compressed_size, uncompressed_size))

          print(f"local_header_entries={len(local_entries)}")
          for pos, filename, flags, compressed_size, uncompressed_size in local_entries:
              print(
                  f"local_header offset={pos} name={filename!r} flags={flags} "
                  f"compressed_size={compressed_size} uncompressed_size={uncompressed_size}"
              )

          observed_names = {
              filename for _, filename, *_ in local_entries
              if not filename.startswith("<")
          }
          suffix_presence = {
              suffix: any(name == suffix or name.endswith("/" + suffix) for name in observed_names)
              for suffix in sorted(required_suffixes)
          }
          print("required_source_suffixes_in_surviving_local_headers=" + repr(suffix_presence))

          eocd = canonical.rfind(eocd_sig)
          if eocd >= 0 and len(canonical) >= eocd + 22:
              sig, disk_no, cd_disk, disk_entries, total_entries, cd_size, cd_offset, comment_len = struct.unpack_from(
                  "<4s4H2LH", canonical, eocd
              )
              expected_eof = eocd + 22 + comment_len
              cd_end = cd_offset + cd_size
              cd_signature_ok = canonical[cd_offset:cd_offset + 4] == central_sig if cd_offset + 4 <= len(canonical) else False
              print(
                  "eocd_present=true "
                  f"eocd_offset={eocd} disk_no={disk_no} cd_disk={cd_disk} "
                  f"disk_entries={disk_entries} total_entries={total_entries} "
                  f"cd_offset={cd_offset} cd_size={cd_size} cd_end={cd_end} "
                  f"cd_signature_at_declared_offset={cd_signature_ok} "
                  f"comment_len={comment_len} expected_eof={expected_eof} "
                  f"actual_eof={len(canonical)} trailing_or_missing_bytes={len(canonical) - expected_eof} "
                  f"cd_to_eocd_delta={eocd - cd_end}"
              )
          else:
              print("eocd_present=false")
          print("archive_part_diagnostics_end")

          exact_matches = []
          valid_zips = []
          for order in itertools.permutations(parts):
              payload = b"".join(parts[name] for name in order)
              digest = hashlib.sha256(payload).hexdigest()
              is_zip = zipfile.is_zipfile(io.BytesIO(payload))
              detail = ""
              if is_zip:
                  with zipfile.ZipFile(io.BytesIO(payload)) as zf:
                      zip_names = set(zf.namelist())
                      detail = f" entries={len(zip_names)} required_present={required.issubset(zip_names)}"
                  valid_zips.append((order, digest, payload, detail))
              print(f"order={','.join(order)} sha256={digest} valid_zip={is_zip}{detail}")
              if digest == expected:
                  exact_matches.append((order, payload))

          print(f"valid_zip_permutations={len(valid_zips)}")
          print(f"exact_hash_matches={len(exact_matches)}")
          if len(exact_matches) != 1:
              raise SystemExit(
                  f"content-addressed recovery blocked: expected one exact archive, found {len(exact_matches)}; valid zip permutations={len(valid_zips)}"
              )
          order, payload = exact_matches[0]
          Path("/tmp/mcpmaster-recovery-source.zip").write_bytes(payload)
          print(f"verified_part_order={','.join(order)}")
          PY

          rm -rf /tmp/mcpmaster-recovery
          mkdir -p /tmp/mcpmaster-recovery
          unzip -q /tmp/mcpmaster-recovery-source.zip -d /tmp/mcpmaster-recovery
          test -f /tmp/mcpmaster-recovery/source/package.json
          test -f /tmp/mcpmaster-recovery/source/src/http-server.ts
          test -f /tmp/mcpmaster-recovery/source/SOURCE_AUTHORITY_POLICY.json
          file_count="$(find /tmp/mcpmaster-recovery/source -type f | wc -l | tr -d ' ')"
          echo "recovered_source_files=${file_count}"
          test "$file_count" -ge 500

          direct_url_parse="$(grep -RInE --include='*.js' --include='*.cjs' --include='*.mjs' --include='*.ts' --include='*.tsx' '(^|[^[:alnum:]_])url\.parse[[:space:]]*\(' /tmp/mcpmaster-recovery/source --exclude-dir=node_modules || true)"
          if [ -n "$direct_url_parse" ]; then
            echo 'BLOCKED: recovered application source still contains direct url.parse() calls:'
            printf '%s\n' "$direct_url_parse"
            exit 1
          fi
          echo 'direct_url_parse_calls=0'
