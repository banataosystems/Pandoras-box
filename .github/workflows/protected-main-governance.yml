name: Trusted protected main governance

# This workflow is trusted only when it exists on the default branch. It never
# checks out or executes pull-request source. It evaluates provider metadata and
# posts one app-bound custom check to the exact PR head.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_run:
    workflows:
      - Protected main governance candidate
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: trusted-protected-main-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate exact-head evidence from trusted main
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current trusted default-branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(git rev-parse HEAD)"
          test "$trusted_sha" != "${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}" || {
            echo "Refusing to evaluate with candidate source as trusted source" >&2
            exit 1
          }
          echo "trusted_default_branch_sha=$trusted_sha"

      - name: Evaluate and publish exact-head trusted check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/evaluate-protected-main.mjs --github-event "$GITHUB_EVENT_PATH"
