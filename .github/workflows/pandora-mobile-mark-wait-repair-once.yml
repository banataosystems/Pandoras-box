name: Pandora mobile mark cache repair once

on:
  push:
    branches:
      - 'integration/pandora-mobile-p1-current-main-20260819'
    paths:
      - '.github/workflows/pandora-mobile-mark-wait-repair-once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  repair-test-and-self-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      BRANCH: integration/pandora-mobile-p1-current-main-20260819
      APP_DIR: apps/pandora-mobile
      TARGET: apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart
      TARGET_IN_APP: test/goldens/owner_screens_visual_evidence_test.dart
      WORKFLOW_PATH: .github/workflows/pandora-mobile-mark-wait-repair-once.yml
      EVIDENCE_DIR: ${{ github.workspace }}/build/mark-cache-repair-evidence
    steps:
      - name: Register exact repair run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state='pending' \
            -f context='Pandora Mobile mark cache repair once' \
            -f description='Exact PNG engine decode and cache proof is running.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check out exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Seed exact production mark through Flutter image cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path('apps/pandora-mobile/test/goldens/owner_screens_visual_evidence_test.dart')
          text = target.read_text()
          material_import = "import 'package:flutter/material.dart';\n"
          painting_import = "import 'package:flutter/painting.dart';\n"
          if painting_import not in text:
              if text.count(material_import) != 1:
                  raise SystemExit('Expected one Flutter material import; refusing ambiguous edit.')
              text = text.replace(material_import, material_import + painting_import)

          flag = "bool _visualFontLoaded = false;\n"
          seeded_flag = "bool _pandoraMarkImageSeeded = false;\n"
          if seeded_flag not in text:
              if text.count(flag) != 1:
                  raise SystemExit('Expected one visual-font flag; refusing ambiguous edit.')
              text = text.replace(flag, flag + seeded_flag)

          start = text.find('Future<void> _waitForPandoraMark(WidgetTester tester) async {')
          end_marker = '\nclass _VisualCase {'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected one Pandora mark wait function; refusing ambiguous edit.')
          replacement = '''Future<void> _seedPandoraMarkImageCache(WidgetTester tester) async {
            if (_pandoraMarkImageSeeded) return;

            final asset = File(PandoraMark.assetPath);
            if (!asset.existsSync()) {
              throw StateError(
                'The exact Pandora mark asset is missing at ${PandoraMark.assetPath}.',
              );
            }
            final encoded = asset.readAsBytesSync();
            final decoded = await tester.runAsync<ImageInfo>(() async {
              final codec = await ui
                  .instantiateImageCodec(encoded)
                  .timeout(const Duration(seconds: 5));
              try {
                final frame = await codec
                    .getNextFrame()
                    .timeout(const Duration(seconds: 5));
                return ImageInfo(image: frame.image, scale: 1.0);
              } finally {
                codec.dispose();
              }
            });
            if (decoded == null) {
              throw TestFailure(
                'Flutter did not return the decoded exact Pandora mark.',
              );
            }
            if (decoded.image.width != 1024 || decoded.image.height != 1024) {
              final dimensions =
                  '${decoded.image.width}x${decoded.image.height}';
              decoded.image.dispose();
              throw TestFailure(
                'Unexpected Pandora mark dimensions: $dimensions; expected 1024x1024.',
              );
            }

            final key = AssetBundleImageKey(
              bundle: rootBundle,
              name: PandoraMark.assetPath,
              scale: 1.0,
            );
            final cache = PaintingBinding.instance.imageCache;
            cache.evict(key, includeLive: true);
            cache.putIfAbsent(
              key,
              () => OneFrameImageStreamCompleter(
                Future<ImageInfo>.value(decoded),
              ),
            );
            _pandoraMarkImageSeeded = true;
          }
          '''
          text = text[:start] + replacement + text[end:]

          setup_pattern = re.compile(
              r"  if \(!_visualFontLoaded\) \{\n"
              r"\s+await tester\.runAsync\(_loadVisualFont\);\n"
              r"\s+\}\n"
              r"\s+await setTestSurface\(tester, logicalSize: visual\.logicalSize\);\n"
          )
          seeded_setup = '''  if (!_visualFontLoaded) {
            await tester.runAsync(_loadVisualFont);
          }
          if (!_pandoraMarkImageSeeded) {
            await _seedPandoraMarkImageCache(tester);
          }
          await setTestSurface(tester, logicalSize: visual.logicalSize);
          '''
          text, setup_count = setup_pattern.subn(seeded_setup, text, count=1)
          if setup_count != 1:
              raise SystemExit('Expected one visual setup block; refusing ambiguous edit.')

          text, wait_count = re.subn(
              r"\n\s*await _waitForPandoraMark\(tester\);\n",
              '\n',
              text,
              count=1,
          )
          if wait_count != 1:
              raise SystemExit('Expected one obsolete mark wait call; refusing ambiguous edit.')

          comment_pattern = re.compile(
              r"    // Keep repository microtasks and visual state changes inside the finite\n"
              r"    // widget-test clock\. No case can hide later CI stages behind an unbounded\n"
              r"    // settle\. The exact Pandora mark image stream is awaited separately above\n"
              r"    // with a wall-clock ceiling so the first capture cannot omit the asset\.\n"
          )
          new_comment = '''    // Keep repository microtasks and visual state changes inside the finite
            // widget-test clock. The exact production mark has already been decoded
            // from the checked-in PNG and seeded under its production AssetImage key.
            // No case can hide later CI stages behind an unbounded settle.
          '''
          text, comment_count = comment_pattern.subn(new_comment, text, count=1)
          if comment_count != 1:
              raise SystemExit('Expected one obsolete render comment; refusing ambiguous edit.')

          target.write_text(text)
          PY
      - name: Resolve locked dependencies without retaining tooling side effects
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git restore --source="$SOURCE_SHA" -- analysis_options.yaml
          test -z "$(git diff --name-only -- analysis_options.yaml)"
          dart format "$TARGET_IN_APP"
          dart format --output=none --set-exit-if-changed "$TARGET_IN_APP"
      - name: Prove repaired production-screen suite
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter test "$TARGET_IN_APP" --reporter expanded
          test "$(find build/owner-screen-evidence -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '15'
      - name: Verify bounded mutation and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          # `flutter test` performs its own package bootstrap and may modernize
          # analysis_options.yaml again. Restore that tooling side effect before
          # evaluating the exact mobile-source mutation set.
          git restore --source="$SOURCE_SHA" -- apps/pandora-mobile/analysis_options.yaml
          test -z "$(git diff --name-only -- apps/pandora-mobile/analysis_options.yaml)"
          mkdir -p "$EVIDENCE_DIR"
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$TARGET" ]]; then
            printf 'Unexpected pre-removal diff:\n' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check
          git diff -- "$TARGET" > "$EVIDENCE_DIR/repair.patch"
          test -s "$EVIDENCE_DIR/repair.patch"
          target_sha=$(sha256sum "$TARGET" | cut -d ' ' -f1)
          asset_sha=$(sha256sum apps/pandora-mobile/assets/brand/pandora-product-mark-ui-1024.png | cut -d ' ' -f1)
          find apps/pandora-mobile/build/owner-screen-evidence -maxdepth 1 -type f -name '*.png' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$EVIDENCE_DIR/visual-sha256.txt"
          test "$(wc -l < "$EVIDENCE_DIR/visual-sha256.txt" | tr -d ' ')" = '15'
          git add "$TARGET"
          git rm "$WORKFLOW_PATH"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "$TARGET" "$WORKFLOW_PATH" | sort)
          if [[ "${staged[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected staged paths:\n' >&2
            printf '%s\n' "${staged[@]}" >&2
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "target_sha256=$target_sha"
            echo "asset_sha256=$asset_sha"
            echo "flutter=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
            echo "dart=$(dart --version 2>&1)"
            echo "visual_cases=15"
            echo "mark_seed=exact_png_engine_decode_asset_image_cache"
            echo "decode_ceiling_seconds=5_per_operation"
            echo "mutation_paths=$TARGET,$WORKFLOW_PATH"
          } > "$EVIDENCE_DIR/manifest.txt"
      - name: Commit and fast-forward only if branch is unchanged
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [[ "$remote_head" != "$SOURCE_SHA" ]]; then
            echo "Branch moved from $SOURCE_SHA to $remote_head; refusing to overwrite." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(mobile): seed exact mark for production-screen evidence'
          result_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "result_sha=$result_sha" >> "$GITHUB_OUTPUT"
          echo "result_sha=$result_sha" >> "$EVIDENCE_DIR/manifest.txt"
      - name: Upload immutable repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-mark-cache-repair-evidence
          path: build/mark-cache-repair-evidence
          if-no-files-found: warn
          include-hidden-files: true
      - name: Finalize repair status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RESULT_SHA: ${{ steps.apply.outputs.result_sha }}
        run: |
          set -euo pipefail
          state=failure
          description='Exact mark engine-decode cache repair failed closed.'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Exact mark seeded and 15 screens passed at ${RESULT_SHA}."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context='Pandora Mobile mark cache repair once' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
