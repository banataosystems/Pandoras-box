name: Pandora P1 Source Guard v4

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-p1-source-guard-v4.yml

permissions:
  contents: write

jobs:
  harden-owner-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Repair formatting-sensitive guard matcher
        run: |
          python3 automation/repair_p1_plan_matcher.py
          python3 -m py_compile automation/pandora_p1_source_guard.py
      - name: Apply versioned P1 guard
        run: python3 automation/pandora_p1_source_guard.py --apply
      - name: Verify source and existing owner tests
        run: |
          git diff --check
          python3 automation/pandora_p1_source_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified owner-surface hardening
        run: |
          git config user.name 'Pandora Source Guard'
          git config user.email 'pandora-source-guard@users.noreply.github.com'
          git add automation/pandora_p1_source_guard.py supabase/functions/pandora-owner-api/index.ts automation/flutterflow/dsl/10_owner_api_state_navigation.dart automation/flutterflow/dsl/selector_bindings.dart
          git commit -m 'Harden Pandora owner language firewall'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
