name: Pandora SDK Contract Probe Expand

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-sdk-contract-probe-expand.yml

permissions:
  contents: write

jobs:
  expand-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Expand only the signed SDK source context window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('automation/flutterflow/dsl/10_owner_api_state_navigation.dart')
          text = path.read_text()
          old = "final end = i + 12 >= lines.length ? lines.length - 1 : i + 12;"
          new = "final end = i + 40 >= lines.length ? lines.length - 1 : i + 40;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one probe window, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit expanded inspection window
        run: |
          git config user.name 'Pandora SDK Probe'
          git config user.email 'pandora-sdk-probe@users.noreply.github.com'
          git add automation/flutterflow/dsl/10_owner_api_state_navigation.dart
          git commit -m 'Expand signed SDK contract read window'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
