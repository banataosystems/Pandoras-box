name: Pandora mobile one-shot formatter

on:
  pull_request:
    paths:
      - '.github/workflows/pandora-mobile-format-evidence.yml'
      - 'apps/pandora-mobile/lib/**'
      - 'apps/pandora-mobile/test/**'

permissions:
  contents: write

jobs:
  format-once:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pandora-mobile-owner-outcome-p0-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/pandora-mobile-owner-outcome-p0-20260820
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Apply canonical formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib apps/pandora-mobile/test
          rm .github/workflows/pandora-mobile-format-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/lib apps/pandora-mobile/test .github/workflows/pandora-mobile-format-evidence.yml
          if git diff --cached --quiet; then
            echo 'No formatter changes remained.'
            exit 0
          fi
          git commit -m 'style(mobile): apply pinned Dart formatter'
          git push origin HEAD:fix/pandora-mobile-owner-outcome-p0-20260820
