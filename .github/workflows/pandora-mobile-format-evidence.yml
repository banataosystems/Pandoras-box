name: Pandora mobile formatter evidence

on:
  pull_request:
    paths:
      - '.github/workflows/pandora-mobile-format-evidence.yml'
      - 'apps/pandora-mobile/lib/**'
      - 'apps/pandora-mobile/test/**'

permissions:
  contents: read

jobs:
  format-evidence:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Format candidate source
        run: dart format apps/pandora-mobile/lib apps/pandora-mobile/test
      - name: Upload canonical formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pandora-mobile-formatted-source
          path: |
            apps/pandora-mobile/lib
            apps/pandora-mobile/test
          if-no-files-found: error
          include-hidden-files: true
