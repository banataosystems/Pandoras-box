name: Pandora P3 Screen Guard

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-p3-screen-guard.yml

permissions:
  contents: write

jobs:
  current-screen-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Compile source guards
        run: |
          python3 -m py_compile automation/pandora_p1_source_guard.py automation/pandora_p2_design_guard.py automation/pandora_p3_screen_guard.py
      - name: Apply current-screen migration
        run: python3 automation/pandora_p3_screen_guard.py --apply
      - name: Verify P1-P3 contracts and owner tests
        run: |
          git diff --check
          python3 automation/pandora_p1_source_guard.py --check
          python3 automation/pandora_p2_design_guard.py --check
          python3 automation/pandora_p3_screen_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified screen migration
        run: |
          git config user.name 'Pandora Screen Guard'
          git config user.email 'pandora-screen-guard@users.noreply.github.com'
          git add automation/flutterflow/dsl/selector_bindings.dart
          if git diff --cached --quiet; then
            echo 'No current-screen changes were necessary.'
            exit 0
          fi
          git commit -m 'Polish Pandora current owner screens'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
