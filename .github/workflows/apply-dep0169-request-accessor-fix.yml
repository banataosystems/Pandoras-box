name: Apply DEP0169 request accessor remediation

on:
  push:
    branches:
      - fix/dep0169-vercel-request-accessor-20260820
    paths:
      - '.github/workflows/apply-dep0169-request-accessor-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-dep0169-request-accessor-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: fix/dep0169-vercel-request-accessor-20260820

      - name: Verify bounded source lane
        shell: bash
        run: |
          set -euo pipefail
          expected_base='d0b0ec4533410faab4ec59095b5b674c794c1ef7'
          git merge-base --is-ancestor "$expected_base" HEAD
          unexpected="$(
            git diff --name-only "$expected_base"...HEAD |
            grep -Ev '^(.github/workflows/apply-dep0169-request-accessor-fix.yml|test/projectos-mcp-request-accessor.test.js)$' || true
          )"
          test -z "$unexpected" || {
            printf 'Unexpected pre-edit paths:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Replace only the Vercel request accessor block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/projectos-mcp-handler.js')
          source = path.read_text(encoding='utf-8')
          old = '''function requestPath(request) {
              const value = request.originalUrl || request.url || "/";
              try {
                  return new URL(value, DEFAULT_RESOURCE_ORIGIN).pathname;
              } catch {
                  return "/";
              }
          }

          function metadataSelector(request) {
              const value = request.query?.metadata;
              return Array.isArray(value) ? undefined : value;
          }'''
          new = '''function ownStringDataProperty(value, name) {
              if (!value || (typeof value !== "object" && typeof value !== "function")) {
                  return undefined;
              }
              const descriptor = Object.getOwnPropertyDescriptor(value, name);
              return descriptor
                  && Object.prototype.hasOwnProperty.call(descriptor, "value")
                  && typeof descriptor.value === "string"
                  ? descriptor.value
                  : undefined;
          }

          function requestUrlValue(request) {
              return ownStringDataProperty(request, "originalUrl")
                  || ownStringDataProperty(request, "url")
                  || "/";
          }

          function parsedRequestUrl(request) {
              try {
                  return new URL(requestUrlValue(request), DEFAULT_RESOURCE_ORIGIN);
              } catch {
                  return new URL("/", DEFAULT_RESOURCE_ORIGIN);
              }
          }

          function requestPath(request) {
              return parsedRequestUrl(request).pathname;
          }

          function metadataSelector(request) {
              const values = parsedRequestUrl(request).searchParams.getAll("metadata");
              return values.length === 1 ? values[0] : undefined;
          }'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one request accessor block, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = 'src/projectos-mcp-handler.js'
          if grep -F 'request.query?.metadata' src/projectos-mcp-handler.js; then
            echo 'Vercel request.query accessor remains' >&2
            exit 1
          fi
          grep -F 'Object.getOwnPropertyDescriptor(value, name)' src/projectos-mcp-handler.js
          grep -F 'searchParams.getAll("metadata")' src/projectos-mcp-handler.js

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build and run focused accessor contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --test \
            test/projectos-mcp-request-accessor.test.js \
            test/projectos-mcp-oauth-compatibility.test.js \
            test/vercel-entrypoint.test.js

      - name: Run complete repository test suite
        run: npm test

      - name: Commit the bounded source remediation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-dep0169-request-accessor-fix.yml
          git add src/projectos-mcp-handler.js
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/apply-dep0169-request-accessor-fix.yml \
            src/projectos-mcp-handler.js | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): avoid Vercel request URL accessors'
          git push origin HEAD:fix/dep0169-vercel-request-accessor-20260820

          printf '%s\n' \
            'Bounded source remediation committed.' \
            'Temporary helper removed.' \
            'Production mutation: false.' \
            'Deployment performed: false.'
