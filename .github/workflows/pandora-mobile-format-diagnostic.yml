name: Pandora mobile full format diagnostic

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-format-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply-full-pinned-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Apply exact pinned Dart formatting to full mobile source
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib apps/pandora-mobile/test
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/pandora-mobile/lib apps/pandora-mobile/test; then
            echo 'Pinned formatter already clean across lib and test.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/lib apps/pandora-mobile/test
          git commit -m 'style(mobile): apply full pinned Dart formatter output'
          git push origin HEAD:feature/pandora-mobile-premium-foundation
