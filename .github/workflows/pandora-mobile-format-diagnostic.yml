name: Pandora mobile acceptance-format diagnostic

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-format-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply-acceptance-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Reproduce acceptance materialization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
          dart format lib test

      - name: Copy exact acceptance formatter output back to tracked source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/pandora-mobile/lib apps/pandora-mobile/test
          cp -R .pandora-mobile-build/lib apps/pandora-mobile/lib
          cp -R .pandora-mobile-build/test apps/pandora-mobile/test
          git diff --check

      - name: Commit exact acceptance formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/pandora-mobile/lib apps/pandora-mobile/test; then
            echo 'Acceptance materialization produces no formatter delta.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/lib apps/pandora-mobile/test
          git commit -m 'style(mobile): apply acceptance-materialized Dart formatter output'
          git push origin HEAD:feature/pandora-mobile-premium-foundation
