name: Pandora mobile accessibility diagnostic

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-accessibility-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Materialize acceptance package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock

      - name: Resolve locked dependencies
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Capture accessibility output
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set +e
          flutter test test/accessibility/foundation_accessibility_test.dart --reporter expanded > ../accessibility-diagnostic.txt 2>&1
          code=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$code" >> ../accessibility-diagnostic.txt
          test "$code" -ne 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/pandora-mobile/docs/evidence
          cp accessibility-diagnostic.txt apps/pandora-mobile/docs/evidence/transparent-background-a11y-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pandora-mobile/docs/evidence/transparent-background-a11y-diagnostic.txt
          git commit -m "test(mobile): capture transparent accessibility failure"
          git push origin HEAD:feature/pandora-mobile-premium-foundation
