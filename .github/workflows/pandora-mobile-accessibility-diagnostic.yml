name: Pandora mobile accessibility diagnostic

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-accessibility-diagnostic.yml'

permissions:
  contents: read
  checks: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Materializ package
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock
      - name: Resolve locked dependencies
        working-directory: .pandora-mobile-build
        run: |
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock
      - name: Capture accessibility output
        id: a11
        working-directory: .pandora-mobile-build
        shell: bash
        run: |
          set +e
          flutter test test/accessibility/foundation_accessibility_test.dart --reporter expanded > ../a11.xtxt 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic check
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
          API: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          text = pathlib.Path('a11.xtxt').read_text(errors='replace')
          text = text[-15000:]
          payload = {
            'name': 'accessibility-output',
            'head_sha': os.environ['SHA'],
            'status': 'completed',
            'conclusion': 'neutral',
            'output': {'title': 'Pinned Flutter accessibility diagnostics', 'summary': '```text\n' + text + '\n```'},
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(os.environ['API'] + '/repos/' + os.environ['REPO'] + '/check-runs', data=data, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=10) as resp:
              print(resp.read().decode()[:500])
          PY
