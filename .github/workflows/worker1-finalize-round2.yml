# One-shot retrigger after workflow registration on the isolated successor branch.
name: Worker 1 finalize reliability round two

on:
  push:
    branches:
      - fix/projectos-memory-reliability-round2-20260819

permissions:
  contents: write

concurrency:
  group: worker1-finalize-round2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact isolated successor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply the reviewed source and contract corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/worker1_apply_review_round2.py
          python .github/scripts/worker1_finalize_round2.py

      - name: Remove every temporary write-capable automation file
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/worker1-apply-review-round2.yml
          rm .github/workflows/worker1-finalize-round2.yml
          rm .github/scripts/worker1_apply_review_round2.py
          rm .github/scripts/worker1_finalize_round2.py

      - name: Prove the candidate diff is bounded to Worker 1 source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            '.github/scripts/worker1_apply_review_round2.py' \
            '.github/scripts/worker1_finalize_round2.py' \
            '.github/workflows/worker1-apply-review-round2.yml' \
            '.github/workflows/worker1-finalize-round2.yml' \
            'src/projectos-mcp-handler.js' \
            'src/runtime/execution-ledger-client.js' \
            'src/tools/memory-evidence-intake.js' \
            'test/execution-ledger-finalization-contract.test.js' \
            'test/memory-evidence-intake.test.js' \
            'test/projectos-memory-claude-review-regression.test.js' \
            'test/projectos-memory-supabase-contract-regression.test.js' | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete source checks
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit only the verified source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(projectos): close reliability review gaps"
          git push origin "HEAD:refs/heads/fix/projectos-memory-reliability-round2-20260819"
