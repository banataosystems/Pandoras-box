name: Capture FlutterFlow patch error v2

on:
  push:
    branches:
      - codex/flutterflow-full-integration-candidate-20260814
    paths:
      - .github/workflows/flutterflow-patch-diagnostic-v2.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture exact error
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/flutterflow-full-integration-candidate-20260814
          HELPER_BRANCH: codex/flutterflow-readiness-provider
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git config user.name "Banatao Systems ProjectOS"
          git config user.email "projectos@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" "refs/heads/${HELPER_BRANCH}:refs/remotes/origin/${HELPER_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          git show "refs/remotes/origin/${HELPER_BRANCH}:.github/workflows/flutterflow-full-integration.yml" > /tmp/helper.yml
          awk '
            /^      - name: Extend FlutterFlow Project API provider$/ { step=1; next }
            step && /^        run: \|$/ { body=1; next }
            body && /^      - name:/ { exit }
            body {
              if (substr($0,1,10) == "          ") print substr($0,11);
              else print $0;
            }
          ' /tmp/helper.yml > /tmp/apply.py
          mkdir -p recovery/evidence/flutterflow
          set +e
          python /tmp/apply.py >/tmp/stdout.txt 2>/tmp/stderr.txt
          code=$?
          set -e
          {
            echo "branch_head=$(git rev-parse HEAD)"
            echo "helper_head=$(git rev-parse refs/remotes/origin/${HELPER_BRANCH})"
            echo "apply_bytes=$(wc -c < /tmp/apply.py)"
            printf 'first_line='
            head -n 1 /tmp/apply.py
            echo "python_status=${code}"
            echo "--- stdout ---"
            cat /tmp/stdout.txt
            echo "--- stderr ---"
            cat /tmp/stderr.txt
          } > recovery/evidence/flutterflow/candidate-patch-exception-v2.txt
          git add recovery/evidence/flutterflow/candidate-patch-exception-v2.txt
          git commit -m "evidence: capture FlutterFlow patch error v2"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
