name: Worker 1 finalize clean reliability candidate

on:
  push:
    branches:
      - fix/projectos-memory-supabase-contracts-20260819
    paths:
      - .github/workflows/worker1-finalize-clean-candidate.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: worker1-memory-projectos-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Verify, self-clean, and bind exact-head evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated Worker 1 branch
        uses: actions/checkout@v4
        with:
          ref: fix/projectos-memory-supabase-contracts-20260819
          fetch-depth: 0

      - name: Record immutable input and main
        id: input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/projectos-memory-supabase-contracts-20260819"
          git fetch origin main --no-tags
          echo "input_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Apply pending bounded remediation when required
        id: transform
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/scripts/worker1_apply_review_round3.py; then
            python -m py_compile .github/scripts/worker1_apply_review_round3.py
            python .github/scripts/worker1_apply_review_round3.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove second-round source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'execution_finalization_ambiguous' src/runtime/execution-ledger-client.js
          grep -q 'provider_response_contract_error' src/projectos-mcp-handler.js
          grep -q 'status_intake_mismatch' src/tools/memory-evidence-intake.js
          grep -q 'strict Memory success response rejects unknown and mismatched trust fields' test/projectos-memory-supabase-contract-regression.test.js
          test -f test/execution-ledger-finalization-contract.test.js

      - name: Remove all temporary Worker 1 automation
        shell: bash
        run: |
          set -euo pipefail
          find .github/scripts -maxdepth 1 -type f \( -name 'worker1*round3*' -o -name 'worker1_apply_review_round3.py' \) -print -delete 2>/dev/null || true
          find .github/workflows -maxdepth 1 -type f \( -name 'worker1-apply-review-round3*.yml' -o -name 'worker1-finalize-clean-candidate.yml' \) -print -delete 2>/dev/null || true

      - name: Enforce final lane path boundary
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only | sort -u > /tmp/staged-paths.txt
          git diff --name-only origin/main...HEAD | sort -u > /tmp/existing-branch-paths.txt
          {
            cat /tmp/existing-branch-paths.txt
            cat /tmp/staged-paths.txt
          } | sort -u > /tmp/effective-paths.txt

          cat > /tmp/allowed-paths.txt <<'EOF'
          src/projectos-mcp-handler.js
          src/runtime/execution-ledger-client.js
          src/tools/memory-evidence-intake.js
          test/execution-ledger-finalization-contract.test.js
          test/projectos-memory-supabase-contract-regression.test.js
          EOF
          sort -o /tmp/allowed-paths.txt /tmp/allowed-paths.txt

          grep -vE '^\.github/(scripts|workflows)/worker1' /tmp/effective-paths.txt > /tmp/effective-without-temp.txt || true
          comm -23 /tmp/effective-without-temp.txt /tmp/allowed-paths.txt > /tmp/unowned-paths.txt
          if test -s /tmp/unowned-paths.txt; then
            echo 'Unowned final paths:'
            cat /tmp/unowned-paths.txt
            exit 1
          fi

          ! git ls-files | grep -E '^\.github/(scripts|workflows)/worker1.*(round3|finalize-clean-candidate)'
          ! grep -R --line-number --fixed-strings 'worker1_apply_review_round3' src test
          ! grep -R --line-number --fixed-strings 'worker1-apply-review-round3' src test
          git diff --cached --check
          {
            echo 'paths<<EOF'
            cat /tmp/effective-without-temp.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci 2>&1 | tee /tmp/npm-ci.log

      - name: Source and migration integrity
        shell: bash
        run: npm run check:source 2>&1 | tee /tmp/source-integrity.log

      - name: Targeted reliability regressions
        shell: bash
        run: |
          set -o pipefail
          node --test test/projectos-memory-supabase-contract-regression.test.js 2>&1 | tee /tmp/target-memory.log
          node --test test/execution-ledger-finalization-contract.test.js 2>&1 | tee /tmp/target-ledger.log

      - name: Complete repository test suite
        shell: bash
        run: npm test 2>&1 | tee /tmp/full-tests.log

      - name: Production dependency security audit
        shell: bash
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.log

      - name: Commit exact clean candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            FINAL_SHA="$(git rev-parse HEAD)"
          else
            git commit -m 'fix(projectos): finalize reliability review candidate'
            FINAL_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:fix/projectos-memory-supabase-contracts-20260819
          fi
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          git diff --name-only origin/main..."$FINAL_SHA" | sort -u > /tmp/final-paths.txt
          if grep -E '^\.github/(scripts|workflows)/worker1' /tmp/final-paths.txt; then
            echo 'Temporary automation remains in final branch diff.'
            exit 1
          fi

      - name: Post exact-head candidate and governance request
        if: success()
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ steps.input.outputs.input_sha }}
          MAIN_SHA: ${{ steps.input.outputs.main_sha }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
          FINAL_PATHS: ${{ steps.paths.outputs.paths }}
        with:
          script: |
            const paths = (process.env.FINAL_PATHS || '').trim().split('\n').filter(Boolean).map(p => `- \`${p}\``).join('\n');
            const body = [
              '## Worker 1 clean exact-head candidate — independent gates requested',
              '',
              `- Base main SHA: \`${process.env.MAIN_SHA}\``,
              `- Workflow input SHA: \`${process.env.INPUT_SHA}\``,
              `- Final candidate SHA: \`${process.env.FINAL_SHA}\``,
              `- Verification run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Source/migration integrity: PASS',
              '- Targeted Memory/ProjectOS contract regressions: PASS',
              '- Complete repository test suite: PASS',
              '- Production dependency audit at high severity: PASS',
              '- Temporary Worker 1 automation in final diff: NONE',
              '- Merge: NOT PERFORMED',
              '- Deployment / production mutation: NOT PERFORMED',
              '',
              '### Effective changed paths',
              paths || '- none',
              '',
              '### Independent gates now requested',
              `1. Worker 3: independently verify the exact changed-path set and absence of unregistered write-capable workflows at \`${process.env.FINAL_SHA}\`.`,
              `2. Qualified independent reviewer: review the source and threat model at exactly \`${process.env.FINAL_SHA}\`.`,
              '3. Master: keep PR #56 closed until both gates pass; any new commit invalidates exact-head review.',
              '',
              'This comment is implementation-worker evidence only. It is not an approval, reopening authorization, merge authorization, deployment authorization, or production verification.',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 56, body });

      - name: Post fail-closed diagnostic
        if: failure()
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ steps.input.outputs.input_sha }}
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const tails = [];
            for (const file of ['/tmp/source-integrity.log','/tmp/target-memory.log','/tmp/target-ledger.log','/tmp/full-tests.log','/tmp/audit.log']) {
              if (fs.existsSync(file)) {
                const lines = fs.readFileSync(file,'utf8').split('\n').slice(-40).join('\n');
                tails.push(`### ${file}\n\`\`\`text\n${lines.replace(/[`]/g, "'")}\n\`\`\``);
              }
            }
            let status='';
            try { status=cp.execSync('git status --short', {encoding:'utf8'}).slice(0,4000); } catch {}
            const body = [
              '## Worker 1 clean-candidate finalization FAILED CLOSED',
              '',
              `- Input SHA: \`${process.env.INPUT_SHA || context.sha}\``,
              `- Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Clean candidate: NOT CLAIMED',
              '- Merge: NOT PERFORMED',
              '- Deployment / production mutation: NOT PERFORMED',
              '',
              '### Working-tree diagnostic',
              '```text',
              status || '(clean or unavailable)',
              '```',
              ...tails,
              '',
              'The lane remains quarantined. The exact failed step must be remediated before any new SHA, review, reopen, merge, or deployment claim.',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 56, body });
