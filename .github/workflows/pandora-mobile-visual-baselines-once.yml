name: Pandora mobile visual baseline candidates once

# Triggered only after the exact-head inventory gate proved the 15 real-screen
# comparison baselines were absent. Outputs remain unreviewed candidates.
# Re-run after correcting only the test-relative golden matcher path.
on:
  push:
    branches:
      - 'integration/pandora-mobile-p1-current-main-20260819'
    paths:
      - '.github/workflows/pandora-mobile-visual-baselines-once.yml'

permissions:
  contents: write

jobs:
  generate-review-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      BRANCH: integration/pandora-mobile-p1-current-main-20260819
      APP_DIR: apps/pandora-mobile
      WORKFLOW_PATH: .github/workflows/pandora-mobile-visual-baselines-once.yml
      BASELINE_DIR: apps/pandora-mobile/test/goldens/owner_screens
      MANIFEST_PATH: apps/pandora-mobile/docs/testing/owner-screen-baseline-candidate-manifest.txt
    steps:
      - name: Check out exact source with bounded push credential
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: true
      - name: Verify exact source checkout and unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote_head" = "$SOURCE_SHA"
      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve locked dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting and static analysis before capture
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
      - name: Generate exact production-screen captures
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/owner-screen-evidence test/goldens/owner_screens
          flutter test test/goldens/owner_screens_visual_evidence_test.dart --reporter expanded
          test -d build/owner-screen-evidence
      - name: Verify exact candidate set and materialize baselines
        shell: bash
        run: |
          set -euo pipefail
          expected=$(mktemp)
          actual=$(mktemp)
          cat > "$expected" <<'EOF'
          activity_populated_porcelain_390x844.png
          approvals_high_risk_1_6x_text_390x844.png
          approvals_high_risk_porcelain_390x844.png
          command_initial_porcelain_390x844.png
          connections_degraded_graphite_390x844.png
          connections_healthy_porcelain_390x844.png
          home_attention_porcelain_320x800.png
          home_attention_porcelain_390x844.png
          home_degraded_graphite_390x844.png
          home_loading_porcelain_390x844.png
          memory_approved_porcelain_390x844.png
          project_detail_porcelain_390x844.png
          projects_list_porcelain_390x844.png
          safety_protected_porcelain_390x844.png
          settings_porcelain_390x844.png
          EOF
          sed -i 's/^          //' "$expected"
          find "$APP_DIR/build/owner-screen-evidence" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(wc -l < "$actual")" -eq 15
          install -d "$BASELINE_DIR"
          while IFS= read -r name; do
            source="$APP_DIR/build/owner-screen-evidence/$name"
            test -s "$source"
            case "$name" in
              *320x800.png) file "$source" | grep -Eq 'PNG image data, 320 x 800' ;;
              *) file "$source" | grep -Eq 'PNG image data, 390 x 844' ;;
            esac
            install -m 0644 "$source" "$BASELINE_DIR/$name"
          done < "$actual"
      - name: Re-run all candidate comparisons
        working-directory: ${{ env.APP_DIR }}
        run: flutter test test/goldens/owner_screens_visual_evidence_test.dart --reporter expanded
      - name: Record immutable candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          install -d "$(dirname "$MANIFEST_PATH")"
          {
            echo 'candidate_status=unreviewed'
            echo 'visual_acceptance=false'
            echo "source_sha=$SOURCE_SHA"
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$BRANCH"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "flutter=$(flutter --version --machine | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["frameworkVersion"])')"
            echo "dart=$(dart --version 2>&1)"
            echo 'capture_test=test/goldens/owner_screens_visual_evidence_test.dart'
            echo 'baseline_count=15'
            echo 'review_gate=qualified independent production-screen visual review bound to the final exact head'
            echo
            (cd "$BASELINE_DIR" && sha256sum *.png)
          } > "$MANIFEST_PATH"
          test "$(grep -c '  .*\.png$' "$MANIFEST_PATH")" -eq 15
      - name: Verify bounded mutation scope
        shell: bash
        run: |
          set -euo pipefail
          # Flutter creates untracked package/build caches and proposes an
          # analysis-options migration. Remove only generated state and restore
          # that tracked tooling rewrite before enforcing the exact source set.
          rm -rf "$APP_DIR/.dart_tool" "$APP_DIR/build"
          git restore -- "$APP_DIR/analysis_options.yaml"
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          allowed_prefix="$BASELINE_DIR/"
          for path in "${changed[@]}"; do
            if [[ "$path" == "$MANIFEST_PATH" || "$path" == "$WORKFLOW_PATH" || "$path" == "$allowed_prefix"* ]]; then
              continue
            fi
            echo "Unexpected mutation path: $path" >&2
            exit 1
          done
          test -n "${changed[*]}"
          test -f "$WORKFLOW_PATH"
          test -f "$MANIFEST_PATH"
          test "$(find "$BASELINE_DIR" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 15
      - name: Commit candidates and self-remove only on unchanged head
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [[ "$remote_head" != "$SOURCE_SHA" ]]; then
            echo "Branch moved from $SOURCE_SHA to $remote_head; refusing to overwrite." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BASELINE_DIR" "$MANIFEST_PATH"
          git rm "$WORKFLOW_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          test "$(printf '%s\n' "${staged[@]}" | grep -c "^$BASELINE_DIR/.*\.png$")" -eq 15
          test "$(printf '%s\n' "${staged[@]}" | grep -c "^$MANIFEST_PATH$")" -eq 1
          test "$(printf '%s\n' "${staged[@]}" | grep -c "^$WORKFLOW_PATH$")" -eq 1
          test "${#staged[@]}" -eq 17
          git commit -m 'test(mobile): add unreviewed production-screen baseline candidates'
          git push origin "HEAD:refs/heads/$BRANCH"
