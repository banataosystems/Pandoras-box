name: Pandora APK delivery

on:
  push:
    branches:
      - artifact/apk-delivery-workflow
    paths:
      - '.github/workflows/recovery-actions-write-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout4
        with:
          fetch-depth: 0

      - name: Download verified Android artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31709218285
          name: pandora-mobile-android-debug
          path: /tmp/pandora-apk

      - name: Publish temporary APK delivery branch
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find /tmp/pandora-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"

          delivery_branch="artifact/pandora-apk-9184656076"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$delivery_branch"

          rm -rf artifact-delivery
          mkdir -p artifact-delivery
          split -b 8m -d -a 03 "$apk" artifact-delivery/Pandora.apk.part-
          sha256sum "$apk" | awk '{print $1}' > artifact-delivery/Pandora.apk.sha256
          stat -c '%s' "$apk" > artifact-delivery/Pandora.apk.size
          find artifact-delivery -type f -name 'Pandora.apk.part-*' | sort | wc -l | tr -d ' ' > artifact-delivery/Pandora.apk.parts

          git add -f artifact-delivery
          git commit -m "artifact: stage verified Pandora APK for delivery"
          git push --force origin "HEAD:refs/heads/$delivery_branch"
