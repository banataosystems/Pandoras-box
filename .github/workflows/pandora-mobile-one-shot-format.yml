name: Pandora mobile one-shot formatter

on:
  push:
    branches:
      - 'fix/pandora-mobile-owner-outcome-p0-20260820'
    paths:
      - '.github/workflows/pandora-mobile-one-shot-format.yml'

permissions:
  contents: write

jobs:
  format-once:
    if: ${{ github.ref == 'refs/heads/fix/pandora-mobile-owner-outcome-p0-20260820' && github.repository == 'banataosystems/Pandoras-box' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out formatter candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/pandora-mobile-owner-outcome-p0-20260820
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Apply canonical Dart formatter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/pandora-mobile/lib apps/pandora-mobile/test
          rm .github/workflows/pandora-mobile-one-shot-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pandora-mobile/lib apps/pandora-mobile/test .github/workflows/pandora-mobile-one-shot-format.yml
          git commit -m 'style(mobile): apply pinned Dart formatter'
          git push origin HEAD:fix/pandora-mobile-owner-outcome-p0-20260820
