name: Vercel release evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read
  checks: read
  actions: read

concurrency:
  group: vercel-release-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out literal exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          printf 'exact_head=%s\n' "$ACTUAL_SHA"

      - name: Use pinned Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          check-latest: false
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reject source-authored provider, reviewer, rollback, and authorization claims
        run: node scripts/verify-vercel-release-evidence.mjs --mode repository

      - name: Run release provenance and adversarial regressions
        run: node --test test/vercel-release-evidence.test.js

      - name: Run source and migration integrity checks
        run: npm run check

      - name: Run complete repository test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Capture fresh GitHub and Vercel-bot exact-head evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/collect-github-release-evidence.mjs --output release-evidence.github.json

      - name: Verify live provider packet remains fail-closed to external gates
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/verify-vercel-release-evidence.mjs \
            --mode github \
            --packet release-evidence.github.json \
            --expected-sha "$EXPECTED_SHA" \
            --output release-evidence.github.verdict.json

      - name: Upload exact-head provider evidence packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker4-vercel-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-evidence.github.json
            release-evidence.github.json.sha256
            release-evidence.github.verdict.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral evidence after artifact upload
        run: rm -f release-evidence.github.json release-evidence.github.json.sha256 release-evidence.github.verdict.json

      - name: Assert no generated or uncommitted source drift
        run: test -z "$(git status --porcelain)"
