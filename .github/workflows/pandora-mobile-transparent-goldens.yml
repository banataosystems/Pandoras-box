name: Pandora mobile transparent golden refresh

on:
  push:
    branches:
      - feature/pandora-mobile-premium-foundation
    paths:
      - '.github/workflows/pandora-mobile-transparent-goldens.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Materialize acceptance package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pandora-mobile-build
          mkdir .pandora-mobile-build
          cd .pandora-mobile-build
          flutter create --platforms=android,web --org com.banataosystems --project-name pandora_mobile .
          rm -rf lib test assets pubspec.yaml pubspec.lock analysis_options.yaml
          cp -R ../apps/pandora-mobile/lib ./lib
          cp -R ../apps/pandora-mobile/test ./test
          cp -R ../apps/pandora-mobile/assets ./assets
          cp ../apps/pandora-mobile/pubspec.yaml ./pubspec.yaml
          cp ../apps/pandora-mobile/analysis_options.yaml ./analysis_options.yaml
          test -f ../apps/pandora-mobile/pubspec.lock
          cp ../apps/pandora-mobile/pubspec.lock ./pubspec.lock

      - name: Resolve locked dependencies
        working-directory: .pandora-mobile-build
        run: |
          cp pubspec.lock pubspec.lock.expected
          flutter pub get --enforce-lockfile
          cmp pubspec.lock.expected pubspec.lock

      - name: Verify formatting and analysis
        working-directory: .pandora-mobile-build
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze

      - name: Refresh four governed golden baselines
        working-directory: .pandora-mobile-build
        run: flutter test --update-goldens test/goldens/foundation_catalog_golden_test.dart

      - name: Run full Flutter suite
        working-directory: .pandora-mobile-build
        run: flutter test --reporter expanded

      - name: Build web
        working-directory: .pandora-mobile-build
        run: flutter build web --release

      - name: Build Android debug APK
        working-directory: .pandora-mobile-build
        run: flutter build apk --debug

      - name: Copy refreshed baselines back
        run: |
          rm -rf apps/pandora-mobile/test/goldens/baselines
          cp -R .pandora-mobile-build/test/goldens/baselines apps/pandora-mobile/test/goldens/baselines
          git diff --check

      - name: Verify only governed golden paths changed
        run: |
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              apps/pandora-mobile/test/goldens/baselines/foundation_graphite_360x800.png|apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_360x800.png|apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_320x800.png|apps/pandora-mobile/test/goldens/baselines/foundation_porcelain_2x_text.png) : ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1;;
            esac
          done <<< "$changed"

      - name: Commit reviewed transparent goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pandora-mobile/test/goldens/baselines
          git commit -m "test(mobile): accept transparent golden baselines"
          git push origin HEAD:feature/pandora-mobile-premium-foundation
