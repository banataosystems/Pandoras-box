name: Pandora P1 Source Guard v2

on:
  push:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/workflows/pandora-p1-source-guard-v2.yml

permissions:
  contents: write

jobs:
  harden-owner-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply versioned P1 guard
        run: python3 automation/pandora_p1_source_guard.py --apply
      - name: Verify source and existing owner tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 automation/pandora_p1_source_guard.py --check
          node --experimental-strip-types --test recovery/overlay/*.test.ts
      - name: Commit verified owner-surface hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pandora Source Guard'
          git config user.email 'pandora-source-guard@users.noreply.github.com'
          git add \
            supabase/functions/pandora-owner-api/index.ts \
            automation/flutterflow/dsl/10_owner_api_state_navigation.dart \
            automation/flutterflow/dsl/selector_bindings.dart
          if git diff --cached --quiet; then
            echo 'No source hardening changes were necessary.'
            exit 0
          fi
          git commit -m 'Harden Pandora owner language firewall'
          git push origin HEAD:feature/flutterflow-pandora-mobile-v1
