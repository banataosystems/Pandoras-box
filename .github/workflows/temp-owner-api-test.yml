name: Temporary Pandora Owner API Bridge Tests

on:
  pull_request:
    branches:
      - feature/flutterflow-pandora-mobile-v1
    paths:
      - .github/owner-api-test-trigger.txt

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run owner API bridge tests
        run: node --experimental-strip-types --test recovery/overlay/pandora-owner-api-client.test.ts
